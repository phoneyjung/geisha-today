  position:absolute;left:0;right:0;bottom:34px;text-align:center;
  opacity:0;transition:opacity .55s ease .5s;
}
.noren.shut .shut-note{opacity:1}
.shut-note span{
  font-family:'Noto Serif Thai',serif;font-size:var(--t-s);
  color:rgba(245,237,226,.9);letter-spacing:.4em;text-indent:.4em;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}

/* ═══ ③ แบรนด์ ═══ */
.brand{text-align:center;padding:var(--s2) 0 var(--s3);position:relative;z-index:3}
.wordmark{width:min(268px,72%);display:block;margin:0 auto;border-radius:3px;
  box-shadow:0 var(--s1) 26px rgba(92,26,34,.14)}
.tagline{
  font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);
  letter-spacing:.3em;text-indent:.3em;color:var(--kin-d);margin-top:var(--s2);
}
.divider{display:flex;align-items:center;justify-content:center;gap:var(--s2);
  margin:var(--s3) auto 0;max-width:250px}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--kin),transparent);opacity:.6}
.divider svg{opacity:.85;flex-shrink:0}

/* ═══ ④ วันที่ ═══ */
.today{
  display:flex;align-items:baseline;gap:var(--s2);
  padding:0 2px var(--s2);border-bottom:1px solid var(--line-c);margin-top:var(--s4);
}
.today .d{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:600;line-height:1.3}
.today .cnt{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  color:var(--kin-d);white-space:nowrap}

/* ═══ ⑤ รายชื่อ — แถวสูง 55px (Fib) ═══ */
.person{
  display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 3px;
  border-bottom:1px solid rgba(226,214,196,.72);
  opacity:0;transform:translateY(var(--s1));
  animation:rise .6s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.who{flex:1;min-width:0}
.who .nm{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:500;line-height:1.35}
.who .nm .tag{font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);
  color:var(--aka);font-weight:600;margin-left:4px;letter-spacing:.02em}
.who .fr{font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  color:var(--sumi-2);margin-top:3px;letter-spacing:-.01em;line-height:1.6}
.who .nx{font-size:var(--t-xs);color:var(--aka);margin-top:3px;opacity:.85;font-weight:500}
.person.full .fr{color:#B9AE9E}
.person.full .nm{opacity:.6}
.notebox{
  margin-top:var(--s3);padding:var(--s2) var(--s3);
  background:var(--washi-hi);border:1px solid var(--line-c);border-left:2.5px solid var(--kin);
}
.nb-row{font-size:var(--t-s);color:var(--sumi-2);line-height:1.9}
.nb-row b{color:var(--aka);font-weight:600}
.topdiv{
  text-align:center;padding:var(--s3) 0 var(--s2);
  font-size:var(--t-s);letter-spacing:.06em;color:var(--kin-d);
  opacity:0;transform:translateY(var(--s1));
  animation:rise .6s cubic-bezier(.16,1,.3,1) forwards;
}
.ask{
  flex-shrink:0;padding:var(--s1) var(--s3);border:1px solid var(--aka);
  background:transparent;color:var(--aka);text-decoration:none;border-radius:2px;
  font-size:var(--t-s);font-weight:500;transition:all .25s ease;
}
.ask:hover,.ask:focus-visible{background:var(--aka);color:var(--washi-hi)}

/* ═══ ⑥ สถานะ ═══ */
.state{text-align:center;padding:var(--s5) var(--s3)}
.state .ksv{opacity:.55;margin-bottom:var(--s3)}
.state h2{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:600;margin-bottom:var(--s1)}
.state p{font-size:var(--t-s);color:var(--sumi-2);line-height:1.95}
.state .clock{display:inline-block;margin-top:var(--s3);padding:var(--s1) var(--s3);
  border:1px solid var(--line-c);background:var(--washi-hi);
  font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  letter-spacing:.1em;color:var(--kin-d)}
.skel{height:55px;border-bottom:1px solid rgba(226,214,196,.72);
  background:linear-gradient(90deg,transparent,rgba(197,162,83,.08),transparent);
  background-size:220% 100%;animation:sh 1.5s ease-in-out infinite}
@keyframes sh{to{background-position:-220% 0}}

/* ═══ ⑧ ท้ายหน้า ═══ */
.foot{text-align:center;padding:var(--s4) var(--s2) var(--s1);
  border-top:1px solid var(--line-c);margin-top:var(--s4)}
.foot p{font-size:var(--t-s);color:var(--sumi-2);line-height:2}
.foot .addr{font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);
  letter-spacing:.08em;opacity:.72;margin-top:2px}
.foot .note{margin-top:var(--s2);opacity:.62;font-size:var(--t-xs)}

.petal{position:fixed;top:-24px;pointer-events:none;z-index:0;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}
  14%{opacity:.42}86%{opacity:.32}
  100%{opacity:0;transform:translateY(104dvh) translateX(52px) rotate(300deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  .nrn.l{transform:translateX(-104%)}.nrn.r{transform:translateX(104%)}
  .noren.shut .nrn.l,.noren.shut .nrn.r{transform:translateX(0)}
  .petal{display:none}
}
:focus-visible{outline:2px solid var(--kin);outline-offset:3px}
@media(max-width:380px){
  :root{--t-l:19px;--t-xl:29px}
  .stage{height:172px}
  .ask{padding:7px var(--s2)}
}

const db = getFirestore(initializeApp({

  authDomain: "geisha-coupon.firebaseapp.com",

const bkk = () => new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Bangkok'}));
const DOW = ['sun','mon','tue','wed','thu','fri','sat'];
const DOW_TH = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MON_TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function weekId(d){
  const x=new Date(d.valueOf()); x.setHours(0,0,0,0);
  x.setDate(x.getDate()+4-(x.getDay()||7));
  const y0=new Date(x.getFullYear(),0,1);
  return `${x.getFullYear()}-W${String(Math.ceil((((x-y0)/86400000)+1)/7)).padStart(2,'0')}`;
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = t => { const m=String(t??'').match(/^(\d{1,2}):?(\d{2})?/); return m?`${String(+m[1]).padStart(2,'0')}:${m[2]||'00'}`:''; };
const $ = s => document.querySelector(s);
let cache = null;
let lastUp = '';

const closedNow = () => bkk().getHours() < CFG.openHour;

function render(){
  const box=$('#body'), now=bkk();

  if (closedNow()){
    $('#noren').classList.add('shut');
    const left=CFG.openHour-now.getHours()-1, mins=60-now.getMinutes();
    box.innerHTML=`
      <div class="state">
        <div class="ksv"><svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#C5A253" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><g transform="translate(24 25)"><path transform="rotate(0)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(72)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(144)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(216)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(288)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><circle r="2.7"/></g></svg></div>
        <h2>ตารางวันนี้ยังไม่เปิด</h2>
        <p>รายชื่อพนักงานประจำวันจะขึ้นเวลา <b>09:00 น.</b><br>
           ช่วงนี้ยังไม่มีเจ้าหน้าที่ตอบไลน์ ฝากข้อความไว้ได้เลย<br>
           เราจะติดต่อกลับตอนเช้าค่ะ</p>
        <div class="clock">อีก ${left>0?left+' ชั่วโมง ':''}${mins} นาที</div>
      </div>`;
    return;
  }

  $('#noren').classList.remove('shut');
  if (!cache){ box.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; return; }

  const dstr=`วัน${DOW_TH[now.getDay()]}ที่ ${now.getDate()} ${MON_TH[now.getMonth()]} ${now.getFullYear()+543}`;
  if (!cache.length){
    box.innerHTML=`
      <div class="today"><span class="d">${dstr}</span></div>
      <div class="state"><div class="ksv"><svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#C5A253" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><g transform="translate(24 25)"><path transform="rotate(0)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(72)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(144)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(216)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(288)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><circle r="2.7"/></g></svg></div>
        <h2>ยังไม่มีตารางของวันนี้</h2>
        <p>ทักไลน์สอบถามคิวว่างได้เลยค่ะ<br>เรายินดีจัดคิวให้</p></div>`;
    return;
  }

  const TAG={Top:' (TOP.!)',New:' (NEW.!)',Comeback:' (COMEBACK.!)',Hot:' (HOT.!)'};
  const normal=cache.filter(r=>r.tier!=='Top');
  const tops=cache.filter(r=>r.tier==='Top');
  const row=(r,i)=>`
      <div class="person${r.segs.length?'':' full'}" style="animation-delay:${Math.min(i*42,620)}ms">
        <div class="who">
          <div class="nm">${esc(r.name)}${TAG[r.tier]?`<span class="tag">${TAG[r.tier]}</span>`:''}</div>
          <div class="fr">${r.segs.length?esc(r.segTxt):'คิวเต็มแล้ววันนี้ค่ะ'}</div>
          ${r.nextAts&&r.nextAts.length?`<div class="nx">มีจองต่อตอน ${r.nextAts.join(', ')} น. — ช่วง (1) ขึ้นได้ 1 ชม.ค่ะ</div>`:''}
        </div>
        <a class="ask" href="${CFG.line}" target="_blank" rel="noopener">สอบถาม</a>
      </div>`;
  let k=0;
  box.innerHTML=`
    <div class="today"><span class="d">${dstr}</span><span class="cnt">${cache.length} ท่าน</span></div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);color:var(--sumi-2);opacity:.72;padding:6px 3px 0;">🕰 อัปเดตรอบว่างล่าสุด ${lastUp} น. · รีเฟรชอัตโนมัติ</div>
    <div>
      ${normal.map(r=>row(r,k++)).join('')}
      ${tops.length?`<div class="topdiv" style="animation-delay:${Math.min(k*42,620)}ms">🎏🏮🏮🏮 TOP 🏮🏮🏮🎏</div>`:''}
      ${tops.map(r=>row(r,++k)).join('')}
    </div>
    <div class="notebox">
      <div class="nb-row">🔹 เวลาที่แสดง = <b>จองได้เลยค่ะ</b> · เวลาที่หายไป = น้องไม่ว่างค่ะ</div>
      <div class="nb-row">🔹 <b>(1)</b> = ช่วงนั้นขึ้นได้ <b>1 ชม.</b> เพราะมีจองต่อ — ต้องการ 1.30 ชม. เลือกเวลาก่อนหมดช่วง 30 นาทีนะคะ</div>
      <div class="nb-row" style="opacity:.75">ตัวอย่าง 11:00–12:00(1) หมายถึงมีจองตอน 13:00 · อยากขึ้น 1.30 ชม. ต้องเริ่มก่อน 11:30 ค่ะ</div>
      <div class="nb-row" style="margin-top:6px">รีบนัดก่อนเต็มน้องนะคะ ^^ 💕</div>
    </div>`;

async function load(){
  try{
    const now=bkk(), dk=DOW[now.getDay()];
    const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const [ss,sc,ws,bs]=await Promise.all([
      getDocs(collection(db,'staff')),
      getDoc(doc(db,'schedules',weekId(now))),
      getDocs(query(collection(db,'walkins'),where('date','==',todayStr))),
      getDocs(query(collection(db,'bookings'),where('date','==',todayStr))),
    ]);
    // ⭐ ช่วงเวลาที่ติดคิว (จอง+กำลังใช้) ต่อพนักงาน — เฉพาะเกอิชา
    const t2m=t=>{const m=String(t||'').match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
    const busy={};
    const addBusy=(sid,st,en)=>{const a=t2m(st);if(a==null)return;let b=t2m(en);if(b==null)b=a+90;if(b<=a)b+=1440;(busy[sid]=busy[sid]||[]).push([a,b])};
    const idsOf=r=>{const o=[];if(Array.isArray(r.staffIds))o.push(...r.staffIds);if(r.staffId)o.push(r.staffId);if(r.staffId2)o.push(r.staffId2);return[...new Set(o.filter(Boolean))]};
    ws.forEach(d=>{const w=d.data();if(w.shop!=='geisha'||w.active===false||w.status==='cancelled')return;idsOf(w).forEach(id=>addBusy(id,w.startTime,w.endTime))});
    bs.forEach(d=>{const b=d.data();if(b.shop!=='geisha'||b.status==='cancelled'||b.checkedInWalkinId)return;idsOf(b).forEach(id=>addBusy(id,b.startTime,b.endTime))});
    const nowMin=now.getHours()*60+now.getMinutes();
    const m2t=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
    // ⭐ ช่วงว่างจริงของพนักงาน (format เดียวกับข้อความอัพเดท: 14:00–18:10(1), 21:00–24:00)
    const mEnd=m=>{const x=m%1440;return x===0?'24:00':m2t(x)};
    // (1) = ช่วงนั้นขึ้นได้ 1 ชม. เพราะติดจองต่อ · เวลาจบช่วง = เวลาจองถัดไป − 1 ชม.
    function freeSegs(sid, sStart, sEnd){
      let a=t2m(sStart); if(a==null)a=660;
      let b=t2m(sEnd); if(b==null||b===0)b=1440; if(b<=a)b+=1440;
      const raw=(busy[sid]||[]).map(([x,y])=>[Math.max(x,a),Math.min(y,b)])
        .filter(([x,y])=>y>x).sort((p,q)=>p[0]-q[0]);
      const mg=[];raw.forEach(([x,y])=>{if(mg.length&&x<=mg[mg.length-1][1]+5)mg[mg.length-1][1]=Math.max(mg[mg.length-1][1],y);else mg.push([x,y])});
      let cur=Math.max(a, Math.ceil(nowMin/10)*10);
      const segs=[];
      for(const [x,y] of mg){
        if(y<=cur) continue;
        if(x>cur){
          const dispEnd=x-60;                 // จองได้ช้าสุด = คิวถัดไป − 1 ชม.
          if(dispEnd>=cur) segs.push({f:cur,t:dispEnd,nextAt:x});
        }
        cur=Math.max(cur,y);
      }
      if(cur<b-5) segs.push({f:cur,t:b,nextAt:null});
      return segs.slice(0,3);
    }
    const segText=segs=>segs.map(sg=>`${m2t(sg.f)}–${mEnd(sg.t)}${sg.nextAt?'(1)':''}`).join(', ');
    const staff={}; ss.forEach(d=>{staff[d.id]=d.data()});
    const sched=sc.exists()?sc.data():{};
    const out=[];
    Object.entries(sched).forEach(([sid,week])=>{
      if(!week||typeof week!=='object') return;
      const e=week[dk];
      if(!e||e==='off'||e.off||e.shop!=='geisha') return;
      const s=staff[sid];
      if(!s||s.active===false) return;
      if(String(s.status||'').includes('ลาออก')) return;
      const _segs=freeSegs(sid, hhmm(e.start)||'11:00', hhmm(e.end)||'24:00');
      out.push({
        name:s.nickname||s.nameEn||s.shortCode||'—',
        tier:s.tier||'P',
        segs:_segs,
        segTxt:segText(_segs),
        nextAts:_segs.filter(g=>g.nextAt).map(g=>m2t(g.nextAt)),
        firstFree:_segs.length?_segs[0].f:99999,
      });
    });
    // เรียง: ว่างก่อนขึ้นก่อน · แยกกลุ่ม TOP ไปท้าย (เหมือนข้อความอัพเดท)
    out.sort((x,y)=>x.firstFree-y.firstFree||x.name.localeCompare(y.name,'th'));
    cache=out;
    const _n=bkk(); lastUp=`${String(_n.getHours()).padStart(2,'0')}:${String(_n.getMinutes()).padStart(2,'0')}`;
  }catch(err){
    console.error(err);
    $('#body').innerHTML=`<div class="state"><div class="ksv"><svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#C5A253" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><g transform="translate(24 25)"><path transform="rotate(0)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(72)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(144)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(216)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><path transform="rotate(288)" d="M0,-4.5 C-5.2,-9 -5.2,-16.5 0,-20 C5.2,-16.5 5.2,-9 0,-4.5 Z"/><circle r="2.7"/></g></svg></div>
      <h2>ยังโหลดตารางไม่ได้</h2>
      <p>ลองรีเฟรชอีกครั้ง หรือทักไลน์สอบถามได้เลยค่ะ</p></div>`;
    return;
  }
  render();
}

  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  for(let i=0;i<8;i++){
    const p=document.createElement('div'); p.className='petal';
    const sz=7+Math.random()*6;
    p.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz*.76}px;
      background:rgba(240,190,204,${.4+Math.random()*.28});
      border-radius:${sz}px 0 ${sz}px 0;
      animation-duration:${14+Math.random()*11}s;animation-delay:${-Math.random()*24}s`;
    document.body.appendChild(p);
  }
