<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โปร 9/9 · โยชิ สปา</title>
<meta name="theme-color" content="#5A3A7A">
<meta property="og:title" content="หยุดเวลาให้ได้ 09.09 · โยชิ สปา">
<meta property="og:description" content="กดหยุดนาฬิกาให้ตรง 09.09 · โปร 9–11 ก.ย.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F1E6; --paper:#FDFAF4; --ink:#3E3229; --brown:#6B5B45; --soft:#9A8A72;
  --brand:#5A3A7A; --brand-dk:#3D2755; --tint:#EAE1F3;
  --gold:#B98F4A; --gold-dk:#8F6B2E; --red:#A81B2E; --line:#06C755;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Sarabun',system-ui,sans-serif; color:var(--ink);
  background:var(--cream) url('99-bg.jpg') center/620px repeat fixed;
  min-height:100dvh; display:flex; justify-content:center; align-items:flex-start;
  padding:0 0 env(safe-area-inset-bottom); user-select:none;
}
.app{width:min(100%,410px); background:var(--paper); min-height:100dvh;
     box-shadow:0 0 40px rgba(62,50,41,.10); display:flex; flex-direction:column}

/* ---------- hero ---------- */
.hero{position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--tint)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:72%;
  background:linear-gradient(to top, rgba(30,22,16,.86) 12%, rgba(30,22,16,.45) 48%, transparent)}
.hero .cap{position:absolute;left:0;right:0;bottom:16px;z-index:2;text-align:center;padding:0 20px}
.cap .shop{font-family:'Noto Serif Thai',serif;font-weight:600;font-size:14px;color:#F0D9A8;
  letter-spacing:.22em;text-indent:.22em;margin-bottom:2px}
.cap .big{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:38px;line-height:1.15;color:#FFF9EE;
  text-shadow:0 2px 12px rgba(0,0,0,.4)}
.cap .big em{font-family:'Cormorant Garamond',serif;font-style:normal;font-size:44px;color:#F5CE7E}
.cap .date{font-size:13px;color:#F3E6D2;margin-top:5px;letter-spacing:.02em}

/* ---------- play ---------- */
.play{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 22px 26px}
.rule{font-size:15px;color:var(--brown);text-align:center;line-height:1.55;max-width:30ch}
.rule b{color:var(--ink);font-weight:600}

.clock{position:relative;margin:18px 0 8px;width:min(80vw,300px);padding:22px 10px 18px;text-align:center;
  background:var(--paper);border:2px solid var(--gold);border-radius:18px;
  box-shadow:0 10px 24px rgba(62,50,41,.14), inset 0 0 0 6px var(--cream)}
.clock .lbl{font-size:12.5px;color:var(--soft);letter-spacing:.16em;text-indent:.16em}
.clock .t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:78px;line-height:1;
  color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:6px 0 2px}
.clock .t.hit{color:var(--brand)}
.clock .t small{font-size:.5em;color:var(--soft);font-weight:600}
.clock .target{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:999px;
  background:var(--tint);color:var(--brand-dk);font-weight:600;font-size:14px}
.clock .target em{font-family:'Cormorant Garamond',serif;font-style:normal;font-weight:700;font-size:19px}

.tries{display:flex;gap:9px;margin:12px 0 16px;align-items:center}
.tries span{width:12px;height:12px;border-radius:50%;background:#E3D6BC}
.tries span.used{background:var(--brand)}
.tries .txt{font-size:12.5px;color:var(--soft);margin-left:4px}

button{font-family:inherit;border:0;cursor:pointer;border-radius:999px;font-weight:600}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.act{width:100%;max-width:290px;padding:17px;font-size:20px;letter-spacing:.04em;color:#FFF9EE;
  background:var(--brand);box-shadow:0 5px 0 var(--brand-dk);transition:transform .07s,box-shadow .07s}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-dk)}
.act.stop{background:var(--gold-dk);box-shadow:0 5px 0 #5E4519}
.act.stop:active{box-shadow:0 1px 0 #5E4519}
.act.line{background:var(--line);box-shadow:0 5px 0 #059A43}
.act.line:active{box-shadow:0 1px 0 #059A43}
.act:disabled{opacity:.5}
.note{font-size:13px;color:var(--soft);margin-top:13px;min-height:1.3em;text-align:center}
.foot{width:calc(100% + 44px);margin:18px -22px -26px;display:block;opacity:.95}

/* ---------- result ---------- */
.veil{position:fixed;inset:0;background:rgba(40,31,24,.62);display:none;place-items:center;padding:18px;z-index:10}
.veil.on{display:grid}
.card{width:min(100%,352px);background:var(--paper);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .32s cubic-bezier(.2,1.35,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.card .band{background:var(--brand);color:#FFF3E2;font-family:'Noto Serif Thai',serif;font-weight:600;
  font-size:15px;letter-spacing:.14em;text-indent:.14em;text-align:center;padding:11px}
.card .body{padding:22px 22px 20px;text-align:center}
.winpic{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:10px;margin-bottom:14px}
.mark{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:62px;line-height:1;color:var(--gold-dk);
  font-variant-numeric:tabular-nums}
.mark.miss{color:var(--soft);font-size:52px}
.card h2{font-family:'Noto Serif Thai',serif;font-size:21px;font-weight:600;margin:8px 0 7px;line-height:1.35}
.card p{font-size:14.5px;color:var(--brown);line-height:1.6}
.deal{margin:14px 0 2px;padding:11px 8px;background:var(--cream);border-radius:9px;
  font-size:14px;color:var(--brown);line-height:1.6}
.deal b{color:var(--red);font-size:19px;font-weight:600;font-family:'Noto Serif Thai',serif}
.send{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:14px;padding:15px;
  font-size:17px;color:#fff;background:var(--line);border-radius:999px;box-shadow:0 4px 0 #059A43}
.send:active{transform:translateY(3px);box-shadow:0 1px 0 #059A43}
.send svg{width:21px;height:21px;fill:#fff;flex:none}
.hint{font-size:12.5px;color:var(--soft);margin-top:9px;line-height:1.5}
.again{width:100%;margin-top:11px;padding:12px;font-size:15px;background:transparent;color:var(--brown);
  border:1px solid #DCD0BB;border-radius:999px}
.petal{position:fixed;top:-24px;font-size:20px;pointer-events:none;z-index:11;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.15}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.petal{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <img id="hero" alt="">
    <div class="cap">
      <div class="shop">โยชิ สปา</div>
      <div class="big">โปรพิเศษ <em>9/9</em></div>
      <div class="date">9–11 ก.ย. นี้ · จำนวนจำกัด</div>
    </div>
  </div>

  <div class="play">
    <p class="rule">กด <b>เริ่ม</b> แล้วกด <b>หยุด</b><br>ให้นาฬิกาตรง <b>09.09</b> พอดี · มี 3 ครั้ง</p>

    <div class="clock">
      <div class="lbl">วินาที</div>
      <div class="t" id="disp">00<small>.</small>00</div>
      <div class="target">เป้าหมาย <em>09.09</em></div>
    </div>

    <div class="tries" id="tries"><span></span><span></span><span></span><span class="txt">เหลือ 3 ครั้ง</span></div>

    <button class="act" id="btn">เริ่ม</button>
    <div class="note" id="note"></div>
    <img class="foot" src="99-foot.png" alt="" onerror="this.remove()">
  </div>
</div>

<div class="veil" id="veil">
  <div class="card">
    <div class="band">โยชิ สปา</div>
    <div class="body">
      <img class="winpic" id="rWin" src="t99-win.jpg" alt="" hidden onerror="this.remove()">
      <div class="mark" id="rMark">09.09</div>
      <h2 id="rTitle"></h2>
      <p id="rText"></p>
      <div class="deal">โปร 9/9 · B2B 1 ชม. 15 นาที<br><b>1,500.-</b></div>
      <button class="send" id="rSend">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 5.7 2 10.2c0 4 3.6 7.4 8.4 8.1.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.6 1.1-.5 5.9-3.5 8-6C21.4 13.7 22 12 22 10.2 22 5.7 17.5 2 12 2z"/></svg>
        <span>ส่งข้อความรับสิทธิ์</span>
      </button>
      <div class="hint" id="rHint"></div>
      <button class="again" id="rAgain">ลองอีกครั้ง</button>
    </div>
  </div>
</div>

<script>
/* ===== ตั้งค่า — แก้ได้ ===== */
var OA_ID    = "@ys88";        // LINE OA ID ของร้าน
var OA_LINK  = "https://lin.ee/VJnh6MX";      // ลิงก์สำรอง lin.ee
var MSG      = "ขอรับโปร 9/9";
var TARGET   = 9.09;              // วินาทีเป้าหมาย
var ASSIST   = 0.10;              // หน่วงช่วย: ห่างไม่เกิน ±0.10 วิ นับว่าเข้า
var MAX_TRY  = 3;                 // เล่นได้กี่ครั้ง
var KEY      = "s99t_ys"; // ที่เก็บจำนวนครั้ง (ต่อร้าน)
/* ============================ */
(function(){
  var h=document.getElementById('hero');
  h.src=['t99-hero.jpg','t99-hero2.jpg'][Math.floor(Math.random()*2)];
  h.onerror=function(){h.style.display='none'};

  var disp=document.getElementById('disp'), btn=document.getElementById('btn'),
      note=document.getElementById('note'), triesEl=document.getElementById('tries'),
      veil=document.getElementById('veil'), mark=document.getElementById('rMark'),
      title=document.getElementById('rTitle'), text=document.getElementById('rText'),
      hint=document.getElementById('rHint'), again=document.getElementById('rAgain');

  function getTries(){ try{ return Math.min(MAX_TRY, parseInt(localStorage.getItem(KEY)||'0',10)||0); }catch(e){ return 0; } }
  function setTries(n){ try{ localStorage.setItem(KEY, String(n)); }catch(e){} }
  function fmt(s){ s=Math.max(0,s);
    var c=Math.round(s*100), ss=Math.floor(c/100), hh=c%100;   // ปัดเศษ กัน 9.09 กลายเป็น 09.08
    return (ss<10?'0':'')+ss+'<small>.</small>'+(hh<10?'0':'')+hh; }
  function renderTries(){
    var used=getTries(), dots=triesEl.querySelectorAll('span:not(.txt)');
    for(var i=0;i<dots.length;i++) dots[i].className = i<used ? 'used' : '';
    var left=MAX_TRY-used;
    triesEl.querySelector('.txt').textContent = left>0 ? 'เหลือ '+left+' ครั้ง' : 'ครบ 3 ครั้งแล้ว';
    if(left<=0){ btn.textContent='ส่งข้อความรับสิทธิ์'; btn.className='act line'; btn.disabled=false;
      note.textContent='ครบ 3 ครั้งแล้ว — ยังรับโปรได้ตามปกติ กดปุ่มเลย'; }
  }

  var state='idle', t0=0, raf=0, elapsed=0;
  function tick(){
    elapsed=(performance.now()-t0)/1000;
    disp.innerHTML=fmt(elapsed);
    if(elapsed>=20){ stop(); return; }         // กันลืมกด
    raf=requestAnimationFrame(tick);
  }
  function start(){
    state='run'; t0=performance.now(); disp.className='t';
    btn.textContent='หยุด!'; btn.classList.add('stop'); note.textContent='';
    raf=requestAnimationFrame(tick);
  }
  function stop(){
    cancelAnimationFrame(raf); state='idle';
    elapsed=(performance.now()-t0)/1000;
    var diff=elapsed-TARGET, hit=Math.abs(diff)<=ASSIST;
    if(hit){ elapsed=TARGET; disp.className='t hit'; disp.innerHTML='09<small>.</small>09'; }
    else disp.innerHTML=fmt(elapsed);
    setTries(getTries()+1); renderTries();
    if(navigator.vibrate) navigator.vibrate(hit?[60,40,120]:35);
    btn.classList.remove('stop'); btn.textContent='เริ่ม';
    show(hit, diff);
  }
  function show(hit,diff){
    var wp=document.getElementById('rWin'); if(wp) wp.hidden=!hit;
    mark.className='mark'+(hit?'':' miss');
    mark.textContent=hit?'09.09':fmt(elapsed).replace('<small>.</small>','.');
    var d=Math.abs(diff), near=d<=0.5;
    title.textContent=hit?'ยินดีด้วย คุณได้ส่วนลด!':(near?'เฉียดมาก! กดพลาดไม่เป็นไร':'กดพลาดไม่เป็นไร');
    text.textContent=hit?'หยุดตรง 09.09 พอดีเป๊ะ กดปุ่มด้านล่างส่งข้อความได้เลย'
                        :'ห่างเป้า '+d.toFixed(2)+' วิ · ปลอบใจด้วยโปรโมชั่นดีๆ กดปุ่มด้านล่างส่งข้อความได้เลย';
    hint.textContent=OA_ID?'กดแล้วข้อความจะพิมพ์ให้ในแชท LINE กดส่งได้เลย':'คัดลอกข้อความให้แล้ว วางในแชท LINE ได้เลย';
    var left=MAX_TRY-getTries();
    again.textContent = left>0 ? 'ลองอีกครั้ง (เหลือ '+left+')' : 'ปิด';
    if(hit) petals();
    veil.classList.add('on');
  }
  function petals(){
    if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    for(var i=0;i<18;i++){(function(){
      var s=document.createElement('span'); s.className='petal'; s.textContent='🌸';
      s.style.left=(Math.random()*100)+'vw';
      s.style.animationDuration=(2.2+Math.random()*1.8)+'s';
      s.style.animationDelay=(Math.random()*.6)+'s';
      s.style.fontSize=(14+Math.random()*16)+'px';
      document.body.appendChild(s); setTimeout(function(){s.remove();},4600);
    })();}
  }
  function sendLine(){
    if(OA_ID && OA_ID.charAt(0)==='@'){
      location.href='https://line.me/R/oaMessage/'+encodeURIComponent(OA_ID)+'/?'+encodeURIComponent(MSG); return;
    }
    try{ navigator.clipboard.writeText(MSG); }catch(e){}
    location.href=OA_LINK;
  }
  btn.addEventListener('click',function(){
    if(getTries()>=MAX_TRY){ sendLine(); return; }
    if(state==='idle') start(); else stop();
  });
  again.addEventListener('click',function(){ veil.classList.remove('on'); });
  document.getElementById('rSend').addEventListener('click',sendLine);
  renderTries();
})();
</script>
</body>
</html>
