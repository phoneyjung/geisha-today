<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่น้ำท่วม · PR Spa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#2F3540; --ink2:#5C6573; --paper:#FFFFFF; --mist:#EEF3F7; --line:#D7DFE7;
  --gs:#9D174D; --ys:#5A3A7A;
  --l1:#E2B93B; --l2:#E5803A; --l3:#C9383A; --l0:#4E9A6F;
  --sheet:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--mist);font-family:'Mitr',system-ui,sans-serif;color:var(--ink);font-weight:400}
#map{position:fixed;inset:0;z-index:0}
.leaflet-container{font-family:inherit}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
.top .card{pointer-events:auto;background:var(--paper);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(30,40,60,.14)}
.top h1{font-size:17px;font-weight:600;line-height:1.1}
.top .sub{font-size:12px;color:var(--ink2);margin-top:2px}
.top .count{margin-left:auto;text-align:right;font-size:12px;color:var(--ink2);line-height:1.2}
.top .count b{display:block;font-size:20px;color:var(--ink);font-weight:600}

/* legend chips */
.legend{position:fixed;left:12px;right:12px;z-index:20;top:calc(env(safe-area-inset-top,0px) + 74px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:none}
.legend::-webkit-scrollbar{display:none}
.legend .chip{pointer-events:auto;flex:0 0 auto;background:var(--paper);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(30,40,60,.12);border:2px solid transparent;cursor:pointer;user-select:none}
.legend .chip.off{opacity:.45}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}

/* floating buttons */
.fabs{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:20;display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:50%;background:var(--paper);border:0;box-shadow:0 4px 14px rgba(30,40,60,.18);font-size:20px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.fab:active{transform:scale(.95)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-radius:18px 18px 0 0;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);box-shadow:0 -6px 24px rgba(30,40,60,.14);display:flex;gap:10px;align-items:center}
.bar .hint{font-size:13px;color:var(--ink2);flex:1;line-height:1.3}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:var(--mist);color:var(--ink)}
.btn.danger{background:var(--l3);color:#fff}
.btn.ok{background:var(--l0);color:#fff}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -8px 30px rgba(30,40,60,.22);transform:translateY(110%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:10px}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.lv{border:2px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12.5px;line-height:1.25;cursor:pointer;background:#fff;user-select:none}
.lv .dot{width:16px;height:16px;margin-bottom:4px}
.lv.sel{border-color:var(--ink);background:var(--mist)}
.field{margin-bottom:10px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;background:#fff}
.field textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(20,30,45,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.err{font-size:13px;color:var(--l3);margin:-4px 0 8px;min-height:1em}

/* marker */
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.pin.l1{background:var(--l1)} .pin.l2{background:var(--l2)} .pin.l3{background:var(--l3)} .pin.l0{background:var(--l0)}
.shop{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);display:grid;place-items:center;font-size:17px;color:#fff;font-weight:600}
.shop.gs{background:var(--gs)} .shop.ys{background:var(--ys)}
.leaflet-popup-content{font-family:'Mitr',sans-serif;font-size:14px;line-height:1.4;margin:12px 14px}
.leaflet-popup-content b{font-weight:600}
.leaflet-popup-content .meta{font-size:12px;color:var(--ink2);margin-top:4px}
.leaflet-popup-content .act{margin-top:8px;display:flex;gap:6px}
.leaflet-popup-content .act button{border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.crosshair{position:fixed;left:50%;top:50%;z-index:15;pointer-events:none;transform:translate(-50%,-100%);display:none}
.crosshair.show{display:block}
</style>
</head>
<body>
<div id="map"></div>

<div class="top"><div class="card">
  <div><h1>แผนที่น้ำท่วม</h1><div class="sub" id="sub">กรุงเทพ · นนทบุรี · ปทุมธานี</div></div>
  <div class="count"><b id="cnt">–</b>จุดใน 12 ชม.</div>
</div></div>

<div class="legend" id="legend">
  <div class="chip" data-lv="3"><span class="dot" style="background:var(--l3)"></span>รถเล็กผ่านไม่ได้</div>
  <div class="chip" data-lv="2"><span class="dot" style="background:var(--l2)"></span>ถึงหน้าแข้ง</div>
  <div class="chip" data-lv="1"><span class="dot" style="background:var(--l1)"></span>ถึงข้อเท้า</div>
  <div class="chip" data-lv="0"><span class="dot" style="background:var(--l0)"></span>น้ำลดแล้ว</div>
  <div class="chip off" data-lv="traffy" title="เร็วๆ นี้"><span class="dot" style="background:#8AA"></span>Traffy Fondue</div>
</div>

<div class="crosshair" id="cross"><div class="pin l2" style="width:30px;height:30px"></div></div>

<div class="fabs">
  <button class="fab" id="btnLoc" title="ตำแหน่งฉัน">📍</button>
  <button class="fab" id="btnShops" title="ไปที่ร้าน">🏪</button>
  <button class="fab" id="btnRadar" title="เรดาร์ฝน กทม.">🌧️</button>
  <button class="fab" id="btnShare" title="แชร์">↗</button>
</div>

<div class="bar" id="bar">
  <div class="hint" id="hint">แตะปุ่มแล้วเลื่อนแผนที่ให้หมุดตรงจุดน้ำท่วม</div>
  <button class="btn primary" id="btnAdd">+ ปักหมุด</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h2 id="shTitle">ระดับน้ำตรงนี้</h2>
  <div class="levels" id="levels">
    <div class="lv" data-lv="1"><span class="dot" style="background:var(--l1)"></span><br>ถึงข้อเท้า<br><small>รถผ่านได้</small></div>
    <div class="lv" data-lv="2"><span class="dot" style="background:var(--l2)"></span><br>ถึงหน้าแข้ง<br><small>รถเล็กเสี่ยง</small></div>
    <div class="lv" data-lv="3"><span class="dot" style="background:var(--l3)"></span><br>รถเล็ก<br><small>ผ่านไม่ได้</small></div>
    <div class="lv" data-lv="0"><span class="dot" style="background:var(--l0)"></span><br>น้ำลดแล้ว<br><small>ผ่านได้ปกติ</small></div>
  </div>
  <div class="field"><input id="fNote" placeholder="จุดไหน เช่น ปากซอยพัฒนาการ 65 ฝั่งขาเข้า" maxlength="120"></div>
  <div class="field"><input id="fBy" placeholder="ชื่อคนแจ้ง (เช่น น้องแตงโม)" maxlength="30"></div>
  <div class="err" id="err"></div>
  <div class="row"><button class="btn ghost" id="btnCancel">ยกเลิก</button><button class="btn primary" id="btnSave">บันทึกหมุด</button></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// ── config ──────────────────────────────────────────────
const FLOOD_VER = 'a';
const SHOPS = [
  { id:'gs', name:'เกอิชา สปา (ปากเกร็ด)', lat:13.9105, lng:100.4980, cls:'gs', ch:'G' },   // TODO ใส่พิกัดจริง
  { id:'ys', name:'โยชิ สปา (พัฒนาการ 74)', lat:13.728095, lng:100.655988, cls:'ys', ch:'Y' },
];
const RADIUS_KM = 10;
const WINDOW_H = 12;               // แสดงหมุดย้อนหลังกี่ชั่วโมง
const BOUNDS = [[13.45,100.25],[14.25,101.0]];   // กทม.+นนท์+ปทุม
const TRAFFY_PROXY = '';           // ระยะ A: ใส่ URL Worker แล้วเปิดชิป Traffy
const LV = {1:'ถึงข้อเท้า',2:'ถึงหน้าแข้ง',3:'รถเล็กผ่านไม่ได้',0:'น้ำลดแล้ว'};

firebase.initializeApp({
  apiKey:"AIzaSyBhkUyMQLhWiwGIF7yTSnageSNXmJim6FQ", authDomain:"geisha-coupon.firebaseapp.com",
  projectId:"geisha-coupon", storageBucket:"geisha-coupon.firebasestorage.app",
  messagingSenderId:"620548410470", appId:"1:620548410470:web:d85dcc91390882fef4f1a7"
});
const db = firebase.firestore();
db.settings({ experimentalForceLongPolling:true, useFetchStreams:false, merge:true });
const COL = db.collection('flood_reports');

// ── map ─────────────────────────────────────────────────
const map = L.map('map',{ zoomControl:false, maxBounds:BOUNDS, maxBoundsViscosity:.6 }).setView([13.82,100.58], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  { maxZoom:19, attribution:'&copy; OpenStreetMap &copy; CARTO' }).addTo(map);

const shopLayer = L.layerGroup().addTo(map);
SHOPS.forEach(s=>{
  L.circle([s.lat,s.lng],{radius:RADIUS_KM*1000,color:getVar('--'+s.cls),weight:1.5,fillOpacity:.05,dashArray:'6 6'}).addTo(shopLayer);
  L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:`<div class="shop ${s.cls}">${s.ch}</div>`,iconSize:[34,34],iconAnchor:[17,17]}),zIndexOffset:500})
    .bindPopup(`<b>${s.name}</b><div class="meta">รัศมี ${RADIUS_KM} กม. = วงเส้นประ</div>`).addTo(shopLayer);
});
function getVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

// ── reports ─────────────────────────────────────────────
const hidden = new Set();
const markers = new Map();
let reports = [];
const since = () => Date.now() - WINDOW_H*3600e3;

COL.where('ts','>', since()).orderBy('ts','desc').limit(500).onSnapshot(snap=>{
  reports = snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
}, e=>{ toast('อ่านข้อมูลไม่ได้: '+e.code); console.error(e); });

function render(){
  const keep = new Set();
  let n=0;
  reports.forEach(r=>{
    if(r.ts < since()) return;
    if(hidden.has(String(r.level))) return;
    keep.add(r.id); n++;
    if(markers.has(r.id)) return;
    const m = L.marker([r.lat,r.lng],{icon:L.divIcon({className:'',html:`<div class="pin l${r.level}"></div>`,iconSize:[26,26],iconAnchor:[13,26]})});
    m.bindPopup(()=>popupHtml(r));
    m.addTo(map); markers.set(r.id,m);
  });
  markers.forEach((m,id)=>{ if(!keep.has(id)){ map.removeLayer(m); markers.delete(id);} });
  document.getElementById('cnt').textContent = n;
}
function ago(ts){ const m=Math.round((Date.now()-ts)/60000); return m<60?`${m} นาทีที่แล้ว`:`${Math.floor(m/60)} ชม. ${m%60} นาทีที่แล้ว`; }
function popupHtml(r){
  const near = SHOPS.map(s=>`${s.ch} ${dist(r,s).toFixed(1)} กม.`).join(' · ');
  return `<b>${LV[r.level]}</b><br>${esc(r.note||'')}<div class="meta">${esc(r.by||'ไม่ระบุ')} · ${ago(r.ts)}<br>${near}</div>
  <div class="act">${r.level!==0?`<button style="background:#E6F2EA" onclick="resolveIt('${r.id}')">✓ น้ำลดแล้ว</button>`:''}
  <button style="background:#F3F4F6" onclick="removeIt('${r.id}')">ลบ</button></div>`;
}
function dist(a,b){ const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
window.resolveIt = async id=>{ await COL.doc(id).update({level:0,ts:Date.now()}); markers.get(id)?.remove(); markers.delete(id); map.closePopup(); toast('บันทึกว่าน้ำลดแล้ว ✓'); };
window.removeIt = async id=>{ if(!confirm('ลบหมุดนี้?')) return; await COL.doc(id).delete(); map.closePopup(); toast('ลบแล้ว'); };

// legend toggles
document.getElementById('legend').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const lv=c.dataset.lv;
  if(lv==='traffy'){ toast(TRAFFY_PROXY?'กำลังโหลด Traffy…':'ชั้น Traffy Fondue จะมาในเวอร์ชันถัดไป'); return; }
  c.classList.toggle('off'); hidden.has(lv)?hidden.delete(lv):hidden.add(lv); render();
});

// ── add pin flow ────────────────────────────────────────
let placing=false, lvSel=null;
const cross=document.getElementById('cross'), bar=document.getElementById('bar'), hint=document.getElementById('hint'), btnAdd=document.getElementById('btnAdd');
btnAdd.onclick = ()=>{
  if(!placing){ placing=true; cross.classList.add('show'); btnAdd.textContent='ปักตรงนี้'; hint.textContent='เลื่อนแผนที่ให้หมุดส้มอยู่ตรงจุดน้ำท่วม แล้วกด "ปักตรงนี้"'; map.setZoom(Math.max(map.getZoom(),15)); }
  else openSheet();
};
const sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
function openSheet(){ lvSel=null; document.querySelectorAll('.lv').forEach(x=>x.classList.remove('sel')); document.getElementById('err').textContent=''; document.getElementById('fBy').value=localStorage.getItem('flood_by')||''; sheet.classList.add('open'); scrim.classList.add('show'); }
function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('show'); }
function endPlacing(){ placing=false; cross.classList.remove('show'); btnAdd.textContent='+ ปักหมุด'; hint.textContent='แตะปุ่มแล้วเลื่อนแผนที่ให้หมุดตรงจุดน้ำท่วม'; }
document.getElementById('levels').addEventListener('click',e=>{ const b=e.target.closest('.lv'); if(!b) return; document.querySelectorAll('.lv').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); lvSel=+b.dataset.lv; });
document.getElementById('btnCancel').onclick = ()=>{ closeSheet(); endPlacing(); };
scrim.onclick = ()=>closeSheet();
document.getElementById('btnSave').onclick = async ()=>{
  const err=document.getElementById('err');
  if(lvSel===null){ err.textContent='เลือกระดับน้ำก่อน'; return; }
  const c=map.getCenter(), by=document.getElementById('fBy').value.trim(), note=document.getElementById('fNote').value.trim();
  if(!map.options.maxBounds.contains(c)){ err.textContent='จุดนี้อยู่นอกพื้นที่ กทม./นนท์/ปทุม'; return; }
  try{
    await COL.add({lat:c.lat,lng:c.lng,level:lvSel,note,by,ts:Date.now(),ver:FLOOD_VER});
    localStorage.setItem('flood_by',by);
    document.getElementById('fNote').value='';
    closeSheet(); endPlacing(); toast('ปักหมุดแล้ว ขอบคุณค่ะ 🙏');
  }catch(e){ err.textContent='บันทึกไม่ได้: '+(e.code||e.message); }
};

// ── fabs ─────────────────────────────────────────────────
document.getElementById('btnLoc').onclick = ()=>{
  if(!navigator.geolocation) return toast('มือถือไม่รองรับตำแหน่ง');
  toast('กำลังหาตำแหน่ง…');
  navigator.geolocation.getCurrentPosition(p=>{ map.setView([p.coords.latitude,p.coords.longitude],16); toast('อยู่ตรงนี้'); },
    ()=>toast('เปิดสิทธิ์ตำแหน่งให้เบราว์เซอร์ก่อน'),{enableHighAccuracy:true,timeout:8000});
};
let shopIdx=0;
document.getElementById('btnShops').onclick = ()=>{ const s=SHOPS[shopIdx++%SHOPS.length]; map.flyTo([s.lat,s.lng],13); toast(s.name); };
document.getElementById('btnRadar').onclick = ()=>window.open('https://weather.bangkok.go.th/','_blank');
document.getElementById('btnShare').onclick = async ()=>{
  const url=location.href.split('#')[0];
  if(navigator.share){ try{ await navigator.share({title:'แผนที่น้ำท่วม PR Spa',url}); }catch(_){} }
  else { await navigator.clipboard?.writeText(url); toast('คัดลอกลิงก์แล้ว'); }
};
let tt; function toast(s){ const t=document.getElementById('toast'); t.textContent=s; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }
document.getElementById('sub').textContent += ' · v'+FLOOD_VER;
</script>
</body>
</html>
