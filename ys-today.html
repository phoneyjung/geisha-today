  position:absolute;left:0;right:0;bottom:34px;text-align:center;
  opacity:0;transition:opacity .55s ease .5s;
}
.noren.shut .shut-note{opacity:1}
.shut-note span{
  font-family:'Noto Serif Thai',serif;font-size:var(--t-s);
  color:rgba(245,237,226,.9);letter-spacing:.4em;text-indent:.4em;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}
.brand{text-align:center;padding:var(--s2) 0 var(--s3);position:relative;z-index:3}
.wordmark{width:min(268px,72%);display:block;margin:0 auto;border-radius:3px;
  box-shadow:0 var(--s1) 26px rgba(92,26,34,.14)}
.tagline{
  font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);
  letter-spacing:.3em;text-indent:.3em;color:var(--kin-d);margin-top:var(--s2);
}
.langs{display:flex;justify-content:center;gap:6px;margin-top:var(--s2)}
.lg{
  padding:5px 13px;border:1px solid var(--line-c);background:var(--washi-hi);
  font-family:'IBM Plex Sans Thai',sans-serif;font-size:var(--t-xs);color:var(--sumi-2);
  border-radius:99px;cursor:pointer;transition:all .2s ease;
}
.lg[aria-pressed="true"]{background:var(--aka);border-color:var(--aka);color:var(--washi-hi)}
.langs{display:flex;justify-content:center;gap:5px;margin-top:var(--s2);flex-wrap:wrap}
.lg{
  padding:5px 13px;border:1px solid var(--line-c);background:var(--washi-hi);
  color:var(--sumi-2);font-family:inherit;font-size:var(--t-xs);cursor:pointer;
  border-radius:2px;transition:all .22s ease;letter-spacing:.02em;
}
.lg[aria-pressed="true"]{background:var(--aka);border-color:var(--aka);color:var(--washi-hi);font-weight:600}
.divider{display:flex;align-items:center;justify-content:center;gap:var(--s2);
  margin:var(--s3) auto 0;max-width:250px}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--kin),transparent);opacity:.6}
.divider svg{opacity:.85;flex-shrink:0}
.today{
  display:flex;align-items:baseline;gap:var(--s2);
  padding:0 2px var(--s2);border-bottom:1px solid var(--line-c);margin-top:var(--s4);
}
.today .d{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:600;line-height:1.3}
.today .cnt{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  color:var(--kin-d);white-space:nowrap}
.person{
  display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 3px;
  border-bottom:1px solid rgba(226,214,196,.72);
  opacity:0;transform:translateY(var(--s1));
  animation:rise .6s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.who{flex:1;min-width:0}
.who .nm{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:500;line-height:1.35}
.who .nm .tag{font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);
  color:var(--aka);font-weight:600;margin-left:4px;letter-spacing:.02em}
.who .fr{font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  color:var(--sumi-2);margin-top:3px;letter-spacing:-.01em;line-height:1.6}
.who .nx{font-size:var(--t-xs);color:var(--aka);margin-top:3px;opacity:.85;font-weight:500}
.person.full .fr{color:#B9AE9E}
.person.full .nm{opacity:.6}
.atbox{
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(245,237,226,.5));
  border:1px solid rgba(197,162,83,.34);border-radius:3px;
  padding:var(--s3) var(--s3) var(--s2);margin:var(--s3) 0 var(--s2);
  box-shadow:0 1px 10px rgba(92,26,34,.05);
}
.at-h{font-size:var(--t-m);font-weight:600;color:var(--sumi);letter-spacing:.01em}
.at-s{font-size:var(--t-xs);color:var(--sumi-2);opacity:.8;margin-top:2px;line-height:1.6}
.at-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:var(--s2)}
.at-c{flex:1 1 auto;min-width:72px;padding:8px 6px;border:1px solid rgba(197,162,83,.42);
  background:rgba(255,255,255,.8);color:var(--sumi);border-radius:2px;
  font-family:inherit;font-size:var(--t-xs);cursor:pointer;transition:.2s}
.at-c:hover,.at-c:focus-visible{background:var(--gold);color:#fff;border-color:var(--gold)}
.at-c-all{border-style:dashed;color:var(--sumi-2)}
.at-c-all.on{background:var(--sumi);color:var(--washi);border-color:var(--sumi);border-style:solid}
.at-row{display:flex;gap:5px;margin-top:6px}
.at-row input{flex:1;min-width:0;padding:9px 10px;border:1px solid rgba(197,162,83,.42);
  border-radius:2px;background:#fff;color:var(--sumi);text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:var(--t-m);letter-spacing:.06em}
.at-row input:focus{outline:none;border-color:var(--gold)}
.at-go{padding:9px 18px;border:none;border-radius:2px;background:var(--sumi);color:var(--washi);
  font-family:inherit;font-size:var(--t-s);cursor:pointer;transition:.2s}
.at-go:hover{background:var(--aka)}
.at-on{margin-top:8px;padding-top:8px;border-top:1px solid rgba(197,162,83,.24);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:var(--t-s);font-weight:600;color:var(--aka)}
.at-clr{padding:5px 12px;border:1px solid rgba(92,26,34,.28);background:transparent;
  color:var(--sumi-2);border-radius:2px;font-family:inherit;font-size:var(--t-xs);cursor:pointer}
.at-clr:hover{background:rgba(92,26,34,.06)}
.notebox{
  margin-top:var(--s3);padding:var(--s2) var(--s3);
  background:var(--washi-hi);border:1px solid var(--line-c);border-left:2.5px solid var(--kin);
}
.nb-row{font-size:var(--t-s);color:var(--sumi-2);line-height:1.9}
.nb-row b{color:var(--aka);font-weight:600}
.linebox{margin-top:var(--s3)}
.lb-head{
  font-family:'Noto Serif Thai',serif;font-size:var(--t-m);font-weight:600;
  text-align:center;margin-bottom:var(--s2);color:var(--sumi);
}
.lb-items{display:flex;flex-direction:column;gap:var(--s1)}
.lb-item{
  display:flex;align-items:center;gap:var(--s2);
  padding:var(--s2) var(--s3);text-decoration:none;
  background:var(--washi-hi);border:1px solid var(--line-c);border-radius:2px;
  transition:border-color .25s ease,transform .2s ease;
}
.lb-item:hover,.lb-item:focus-visible{border-color:var(--kin);transform:translateY(-1px)}
.lb-ic{font-size:19px;flex-shrink:0;width:30px;text-align:center}
.lb-tx{flex:1;min-width:0;line-height:1.5}
.lb-tx b{display:block;font-size:var(--t-s);font-weight:600;color:var(--sumi)}
.lb-tx small{display:block;font-size:var(--t-xs);color:var(--sumi-2);margin-top:1px}
.lb-go{color:var(--kin-d);font-size:var(--t-l);flex-shrink:0;line-height:1}
.topdiv{
  text-align:center;padding:var(--s3) 0 var(--s2);
  font-size:var(--t-s);letter-spacing:.06em;color:var(--kin-d);
  opacity:0;transform:translateY(var(--s1));
  animation:rise .6s cubic-bezier(.16,1,.3,1) forwards;
}
.ask{
  flex-shrink:0;padding:var(--s1) var(--s3);border:1px solid var(--aka);
  background:transparent;color:var(--aka);text-decoration:none;border-radius:2px;
  font-size:var(--t-s);font-weight:500;transition:all .25s ease;
}
.ask:hover,.ask:focus-visible{background:var(--aka);color:var(--washi-hi)}
.state{text-align:center;padding:var(--s5) var(--s3)}
.state .ksv{opacity:.55;margin-bottom:var(--s3)}
.state h2{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:600;margin-bottom:var(--s1)}
.state p{font-size:var(--t-s);color:var(--sumi-2);line-height:1.95}
.state .clock{display:inline-block;margin-top:var(--s3);padding:var(--s1) var(--s3);
  border:1px solid var(--line-c);background:var(--washi-hi);
  font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  letter-spacing:.1em;color:var(--kin-d)}
.skel{height:55px;border-bottom:1px solid rgba(226,214,196,.72);
  background:linear-gradient(90deg,transparent,rgba(197,162,83,.08),transparent);
  background-size:220% 100%;animation:sh 1.5s ease-in-out infinite}
@keyframes sh{to{background-position:-220% 0}}

<style>
:root{
  --washi:#F7F5F2; --washi-hi:#FFFFFF;
  --sumi:#2E2A33; --sumi-2:#6B6472;
  --aka:#5A3A7A; --aka-d:#3D2755;
  --kin:#7A5A9E; --kin-d:#5A3A7A;
  --line-c:#E4E0DA;
  --lilac:#EFEAF4;
  --t-xs:12.5px; --t-s:16px; --t-m:20.4px; --t-l:25.9px; --t-xl:41.9px;
  --s1:8px; --s2:13px; --s3:21px; --s4:34px; --s5:55px;
}
body{
  background:var(--washi);
  font-family:'Noto Sans Thai','Noto Sans',system-ui,sans-serif;
  font-weight:400;font-size:var(--t-s);line-height:1.75;letter-spacing:.01em;
  color:var(--sumi);
}
.wrap{max-width:560px;padding-left:var(--s3);padding-right:var(--s3);border:0}
.stage{height:206px}
.stage::after{background:linear-gradient(180deg,rgba(20,16,12,.18) 0%,rgba(247,245,242,.15) 46%,var(--washi) 100%)}
.nrn{filter:grayscale(.42) sepia(.28) hue-rotate(228deg) saturate(1.25) brightness(.92)}
.shut-note span{font-family:inherit;font-size:var(--t-s);font-weight:500;color:#FFF;letter-spacing:.24em;text-indent:.24em}
.brand{padding:var(--s3) 0 var(--s3)}
.wordmark{width:min(238px,66%);border-radius:0;box-shadow:none;mix-blend-mode:multiply}
.tagline{font-family:inherit;font-size:var(--t-xs);font-weight:400;letter-spacing:.22em;text-indent:.22em;color:var(--sumi-2);margin-top:var(--s3)}
.langs{gap:var(--s1);margin-top:var(--s3)}
.lg{min-height:44px;padding:0 var(--s2);display:inline-flex;align-items:center;
  font-size:var(--t-s);font-weight:400;border-radius:2px;background:transparent;
  border:1px solid var(--line-c);color:var(--sumi-2)}
.lg[aria-pressed="true"]{background:var(--aka);border-color:var(--aka);color:#FFF;font-weight:500}
.divider{margin-top:var(--s4)}
.divider i{background:var(--line-c);opacity:1}
.divider svg{opacity:.5}
.today{margin-top:var(--s4);padding-bottom:var(--s3);border-bottom:1px solid var(--sumi)}
.today .d{font-family:inherit;font-size:var(--t-l);font-weight:500;letter-spacing:-.01em}
.today .cnt{font-family:inherit;font-size:var(--t-s);font-weight:400;color:var(--aka);letter-spacing:0}
.person{gap:var(--s3);padding:var(--s3) 2px;min-height:76px;border-bottom:1px solid var(--line-c)}
.who .nm{font-family:inherit;font-size:var(--t-m);font-weight:500;line-height:1.45;letter-spacing:-.005em}
.who .nm .tag{font-family:inherit;font-size:var(--t-xs);font-weight:500;color:#FFF;
  background:var(--aka);padding:2px 7px;border-radius:2px;margin-left:7px;letter-spacing:.04em}
.who .fr{font-family:inherit;font-size:var(--t-s);font-weight:400;color:var(--sumi-2);margin-top:5px;letter-spacing:0}
.who .nx{font-size:var(--t-xs);font-weight:500;color:var(--aka);margin-top:5px;opacity:1}
.person.full{opacity:.44}
.person.full .fr{color:var(--sumi-2)}
.person.full .nm{opacity:1}
.skel{height:76px;border-bottom:1px solid var(--line-c);
  background:linear-gradient(90deg,transparent,rgba(90,58,122,.07),transparent);background-size:220% 100%}
.atbox{background:var(--lilac);border:0;border-radius:2px;padding:var(--s3)}
.at-h{font-family:inherit;font-size:var(--t-m);font-weight:500;color:var(--sumi)}
.at-s{font-size:var(--t-xs);color:var(--sumi-2);margin-top:4px}
.at-chips{gap:var(--s1);margin-top:var(--s3)}
.at-c{min-height:44px;padding:0 var(--s2);display:inline-flex;align-items:center;justify-content:center;
  font-size:var(--t-s);border-radius:2px;background:#FFF;border:1px solid var(--line-c);color:var(--sumi)}
.at-c:hover,.at-c:focus-visible{background:var(--aka);border-color:var(--aka);color:#FFF}
.at-c-all{border-style:solid;color:var(--sumi-2)}
.at-c-all.on{background:var(--aka);border-color:var(--aka);color:#FFF}
.at-row{gap:var(--s1);margin-top:var(--s1)}
.at-row input{min-height:44px;font-size:var(--t-s);background:#FFF;border:1px solid var(--line-c);
  border-radius:2px;color:var(--sumi)}
.at-row input:focus{border-color:var(--aka)}
.at-go{min-height:44px;padding:0 var(--s3);font-size:var(--t-s);font-weight:500;
  background:var(--aka);color:#FFF;border-radius:2px}
.at-go:hover{background:var(--aka-d)}
.at-on{border-top:1px solid rgba(90,58,122,.18);color:var(--aka);font-size:var(--t-s)}
.at-clr{min-height:38px;border:1px solid var(--line-c);color:var(--sumi-2);font-size:var(--t-xs);border-radius:2px}
.at-clr:hover{background:#FFF}
.notebox{background:transparent;border:0;border-left:2px solid var(--aka);border-radius:0;padding-left:var(--s3)}
.nb-row{font-size:var(--t-s);color:var(--sumi-2);line-height:1.8}
.nb-row b{color:var(--aka);font-weight:500}
.lb-head{font-family:inherit;font-size:var(--t-m);font-weight:500;color:var(--sumi);letter-spacing:0}
.lb-items{gap:var(--s1)}
.lb-item{min-height:64px;background:#FFF;border:1px solid var(--line-c);border-radius:2px;padding:var(--s2) var(--s3)}
.lb-item:hover,.lb-item:focus-visible{border-color:var(--aka);transform:none;background:var(--lilac)}
.lb-ic{font-size:22px;width:34px}
.lb-tx b{font-family:inherit;font-size:var(--t-s);font-weight:500;color:var(--sumi)}
.lb-tx small{font-size:var(--t-xs);color:var(--sumi-2);margin-top:3px}
.lb-go{color:var(--aka);font-size:var(--t-m)}
.topdiv{font-size:var(--t-xs);letter-spacing:.16em;color:var(--sumi-2)}
.ask{min-height:44px;display:inline-flex;align-items:center;font-size:var(--t-s);
  color:var(--aka);border:1px solid var(--aka);border-radius:2px}
.ask:hover,.ask:focus-visible{background:var(--aka);color:#FFF}
.state h2{font-family:inherit;font-size:var(--t-l);font-weight:500;color:var(--sumi)}
.state p{font-size:var(--t-s);color:var(--sumi-2);line-height:1.85}
.state .clock{font-family:inherit;font-size:var(--t-s);background:var(--lilac);border:0;
  color:var(--aka);letter-spacing:.06em;border-radius:2px}
.fab{
  min-height:56px;padding:0 var(--s4);font-family:inherit;font-size:var(--t-m);font-weight:500;
  background:var(--aka);color:#FFF;border:0;border-radius:2px;letter-spacing:.01em;
  box-shadow:0 6px 24px rgba(46,42,51,.16);
}
.fab:hover,.fab:focus-visible{background:var(--aka-d);transform:translateX(-50%)}
.fab::after{display:none}
.foot{border-top:1px solid var(--line-c);padding-top:var(--s4)}
.foot p{font-size:var(--t-s);color:var(--sumi-2);line-height:1.9}
.foot .addr{font-family:inherit;font-size:var(--t-xs);letter-spacing:.18em;color:var(--sumi-2)}
.foot .note{font-size:var(--t-xs);opacity:.7}
.petal{filter:saturate(.5) opacity(.6)}
@media(max-width:380px){
  :root{--t-m:19px;--t-l:24px}
  .wrap{padding-left:var(--s2);padding-right:var(--s2)}
}
</style>

<script>
(function(){
  var SEL='.at-c,.at-c-all,.at-go,.at-map,.tv-use,.ask,.lb-item,.lg,.fab,.again,.maplink';
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  document.addEventListener('pointerdown',function(e){
    var el=e.target.closest(SEL); if(!el) return;
    var r=el.getBoundingClientRect(), size=Math.max(r.width,r.height)*1.6;
    var w=document.createElement('span'); w.className='rp-wave';
    w.style.width=w.style.height=size+'px';
    w.style.left=(e.clientX-r.left)+'px'; w.style.top=(e.clientY-r.top)+'px';
    el.appendChild(w); setTimeout(function(){ w.remove(); },600);
  },{passive:true});
})();

<style id="prs-theme">
/* ═══ PR Spa · ธีมร่วม 3 เว็บ (อัปเดตพนักงาน/จอง/รีวิว) — เกอิชา=ซากุระ แดงเลือดหมู · โยชิ=ฟุจิ ม่วง · ทองเชื่อม 2 ร้าน ═══ */
body[data-shop]{--gold:#C5A253;--gold-ink:#7A5A12;--line-g:#06C755}
body[data-shop="geisha"]{--b:#9D174D;--b-ink:#6E0F35;--b-soft:#F8E6EC;--paper:#FBF6EC;--card:#FFFDF9;--ink:#3A2A2E;--muted:#8B7A70;--line:#EADFCB;--pet:rgba(240,176,196,.55)}
body[data-shop="yoshi"]{--b:#5A3A7A;--b-ink:#3E2657;--b-soft:#EEE6F6;--paper:#F6F2F9;--card:#FFFEFF;--ink:#2E2440;--muted:#857A93;--line:#E2D8EC;--pet:rgba(158,128,206,.5)}
html body[data-shop]{background:var(--paper)!important;color:var(--ink)!important;font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif!important}
body[data-shop] .wrap{background:transparent!important}
/* ป้ายไม้ 本日 บนภาพหัว */
body[data-shop] .stage{position:relative}
body[data-shop] .kanban{position:absolute;top:14px;right:14px;z-index:6;writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-weight:800;font-size:21px;letter-spacing:.18em;color:#fff;background:var(--b);border:1.5px solid var(--gold);border-radius:4px;padding:12px 7px 10px;box-shadow:0 6px 16px rgba(0,0,0,.22);line-height:1}
body[data-shop] .kanban small{display:block;font-family:'Noto Sans Thai',sans-serif;font-weight:600;font-size:9px;letter-spacing:.05em;color:var(--gold);margin-top:8px;writing-mode:vertical-rl}
body[data-shop] .stage::after{background:linear-gradient(to bottom,transparent 55%,var(--paper))!important}
/* แบรนด์ + ภาษา */
body[data-shop] .tagline{color:var(--muted)!important;font-family:'Noto Sans Thai',sans-serif!important;letter-spacing:.12em!important;font-size:12px!important}
body[data-shop] .langs{gap:6px!important}
body[data-shop] .lg{background:var(--card)!important;border:1px solid var(--line)!important;color:var(--muted)!important;border-radius:999px!important;font-family:'Noto Sans Thai',sans-serif!important;font-size:13px!important;padding:6px 13px!important;box-shadow:none!important}
body[data-shop] .lg[aria-pressed="true"]{background:var(--b)!important;border-color:var(--b)!important;color:#fff!important;font-weight:600!important}
body[data-shop] .divider svg{stroke:var(--gold)!important}
body[data-shop] .divider i{background:linear-gradient(90deg,transparent,var(--gold),transparent)!important;opacity:.6}
/* หัววันที่ */
body[data-shop] .today{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:10px;border-bottom:1.5px solid var(--gold)!important;padding-bottom:8px!important}
body[data-shop] .today .d{font-family:'Noto Serif Thai',serif!important;font-weight:700!important;font-size:21px!important;color:var(--ink)!important;line-height:1.3}
body[data-shop] .today .cnt{background:var(--b)!important;color:#fff!important;border-radius:999px!important;padding:4px 12px!important;font-size:13px!important;font-weight:600!important;white-space:nowrap;font-family:'Noto Sans Thai',sans-serif!important}
body[data-shop] .today+div{color:var(--muted)!important;font-family:'Noto Sans Thai',sans-serif!important;opacity:1!important}
/* กล่อง "จะถึงร้านกี่โมง" */
body[data-shop] .atbox{background:var(--card)!important;border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:0 4px 14px rgba(60,40,30,.06)!important;padding:16px!important}
body[data-shop] .at-h{font-family:'Noto Serif Thai',serif!important;font-weight:700!important;font-size:18px!important;color:var(--ink)!important}
body[data-shop] .at-s{color:var(--muted)!important;font-size:12.5px!important}
body[data-shop] .at-c{background:var(--b-soft)!important;color:var(--b-ink)!important;border:1px solid transparent!important;border-radius:999px!important;font-weight:500!important;box-shadow:none!important;font-family:'Noto Sans Thai',sans-serif!important}
body[data-shop] .at-c-all{background:transparent!important;border:1px solid var(--b)!important;color:var(--b)!important}
body[data-shop] .at-c-all.on{background:var(--b)!important;color:#fff!important}
body[data-shop] .at-map{background:transparent!important;border:1px solid var(--gold)!important;color:var(--gold-ink)!important;border-radius:999px!important;box-shadow:none!important}
body[data-shop] .at-row input{background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:12px!important;color:var(--ink)!important}
body[data-shop] .at-go{background:var(--b)!important;color:#fff!important;border:0!important;border-radius:12px!important;box-shadow:none!important}
body[data-shop] .at-on{color:var(--b)!important}
/* การ์ดพนักงาน */
body[data-shop] .person{position:relative!important;background:var(--card)!important;border:1px solid var(--line)!important;border-left:1px solid var(--line)!important;border-radius:14px!important;padding:14px 14px 14px 20px!important;margin:10px 0!important;box-shadow:0 2px 10px rgba(60,40,30,.05)!important;overflow:hidden}
body[data-shop] .person::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--b)}
body[data-shop] .person.full::before{background:#D4CCC2}
body[data-shop] .person.full{opacity:.72}
body[data-shop] .who .nm{font-family:'Noto Serif Thai',serif!important;font-weight:700!important;font-size:21px!important;color:var(--ink)!important;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
body[data-shop] .who .fr{color:var(--b)!important;font-weight:600!important;font-size:14.5px!important;font-family:'Noto Sans Thai',sans-serif!important}
body[data-shop] .person.full .fr,body[data-shop] .person.full .nm{color:var(--muted)!important}
body[data-shop] .who .nx{color:var(--muted)!important;font-size:12px!important}
body[data-shop] .who .nm .tag{font-family:'Noto Sans Thai',sans-serif!important;font-size:10.5px!important;font-weight:700!important;letter-spacing:.08em!important;border-radius:999px!important;padding:2px 9px!important;border:1px solid transparent!important;background:var(--b-soft)!important;color:var(--b-ink)!important;box-shadow:none!important}
body[data-shop] .who .nm .tag.t-top{background:#F7EDCF!important;color:var(--gold-ink)!important;border-color:var(--gold)!important}
body[data-shop] .who .nm .tag.t-hot{background:#FBE4E1!important;color:#A3312B!important}
body[data-shop] .who .nm .tag.t-new{background:#E0EFEA!important;color:#1D6A56!important}
body[data-shop] .who .nm .tag.t-comeback{background:#ECE5F5!important;color:#5A3A7A!important}
body[data-shop] .ask{background:transparent!important;border:1.5px solid var(--b)!important;color:var(--b)!important;border-radius:999px!important;font-weight:600!important;font-size:13px!important;padding:8px 16px!important;box-shadow:none!important;font-family:'Noto Sans Thai',sans-serif!important}
body[data-shop] .topdiv{color:var(--gold-ink)!important;font-family:'Noto Serif Thai',serif!important;font-weight:700!important;letter-spacing:.3em!important;font-size:13px!important}
body[data-shop] .topdiv::before,body[data-shop] .topdiv::after{background:var(--gold)!important}
/* กล่องข้อมูล/LINE/สถานะ */
body[data-shop] .notebox,body[data-shop] .linebox,body[data-shop] .state{background:var(--card)!important;border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:none!important}
body[data-shop] .lb-item{border-radius:12px!important;border:1px solid var(--line)!important;background:var(--paper)!important}
body[data-shop] .state h2{font-family:'Noto Serif Thai',serif!important;color:var(--ink)!important}
/* ปุ่มทักไลน์ = เขียว LINE เสมอ */
body[data-shop] .fab{background:var(--line-g)!important;color:#fff!important;border:0!important;border-radius:999px!important;box-shadow:0 8px 22px rgba(6,199,85,.35)!important;font-family:'Noto Sans Thai',sans-serif!important;font-weight:700!important}
body[data-shop] .fab::after{display:none!important}
/* ท้ายหน้า */
body[data-shop] .foot{color:var(--muted)!important}
body[data-shop] .foot p:first-child{font-family:'Noto Serif Thai',serif!important;color:var(--ink)!important;font-weight:600!important}
body[data-shop] .maplink{color:var(--b)!important}
/* กลีบลอย: เกอิชา=ซากุระชมพู · โยชิ=ดอกฟุจิม่วงเม็ดกลม */
body[data-shop] .petal{background:var(--pet)!important}
body[data-shop="yoshi"] .petal{border-radius:50%!important;width:7px!important;height:9px!important}

body[data-shop] .at-clr{background:transparent!important;border:1px solid var(--b)!important;color:var(--b)!important;border-radius:999px!important;padding:4px 12px!important;font-family:'Noto Sans Thai',sans-serif!important;font-size:12.5px!important;font-weight:600!important}


/* v3 — ปุ่มลอยไม่บังจอแรก · ขนาดเท่ากัน 2 ร้าน */
body[data-shop] .fab{position:fixed!important;z-index:60!important;font-size:16px!important;padding:13px 28px!important;gap:10px!important;transition:opacity .25s,visibility .25s!important}
body[data-shop] .fab .ic{width:24px!important;height:24px!important}
body[data-shop] .fab.fab-hide{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
/* ตัวคั่น TOP: เส้นทองขนาบ */
body[data-shop] .topdiv{display:flex!important;align-items:center!important;justify-content:center!important;gap:14px!important;margin:18px 0 6px!important}
body[data-shop] .topdiv::before,body[data-shop] .topdiv::after{content:''!important;display:block!important;flex:1!important;height:1px!important;background:linear-gradient(90deg,transparent,var(--gold))!important;opacity:1!important;position:static!important;width:auto!important}
body[data-shop] .topdiv::after{background:linear-gradient(90deg,var(--gold),transparent)!important}
/* กล่อง "ทัก Line ได้เลยค่ะ": ไอคอนเส้นทอง · ขนาดเท่ากัน */
body[data-shop] .lb-item{padding:12px 14px!important;gap:12px!important;font-size:14px!important;min-height:0!important}
body[data-shop] .lb-ic{width:34px!important;height:34px!important;display:flex!important;align-items:center;justify-content:center;border-radius:50%;background:#F7EDCF;font-size:0!important;flex:none}
body[data-shop] .lb-tx b{font-size:14.5px!important;font-weight:600!important}
body[data-shop] .lb-tx small{font-size:12px!important}

/* v4 — ตัวหนังสืออ่านง่ายขึ้น (ความเข้ม ≥ 4.5) · ตอนร้านยังไม่เปิดซ่อนป้าย 本日 · นับถอยหลังเป็นป้ายทอง */
body[data-shop="geisha"]{--muted:#6E6057}
body[data-shop="yoshi"]{--muted:#685C7A}
body[data-shop] .stage:has(.noren.shut) .kanban,body[data-shop] .kanban.is-shut{display:none!important}
body[data-shop] .state{padding:26px 20px!important;text-align:center}
body[data-shop] .state h2{font-size:20px!important;font-weight:700!important;margin:10px 0 8px!important}
body[data-shop] .state p{font-size:14px!important;line-height:1.8!important;color:var(--muted)!important}
body[data-shop] .state .clock{display:inline-block!important;margin-top:12px!important;background:#F7EDCF!important;color:#7A5A12!important;border:1px solid var(--gold)!important;border-radius:999px!important;padding:6px 18px!important;font-family:'Noto Sans Thai',sans-serif!important;font-weight:600!important;font-size:14px!important;letter-spacing:0!important}

/* v6 — เว้นที่ท้ายหน้าให้ปุ่มเขียว · ปุ่ม "สอบถาม" เป็นวงกลมไอคอนแชท (ทำงานเหมือนเดิม) */
body[data-shop] .wrap{padding-bottom:120px!important}
body[data-shop] .ask{width:44px!important;height:44px!important;min-width:44px!important;padding:0!important;border-radius:50%!important;font-size:0!important;line-height:0!important;color:transparent!important;display:inline-flex!important;align-items:center;justify-content:center;flex:none;background:var(--b-soft) url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%239D174D%22%20stroke-width%3D%221.9%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M4%205h16v11H9l-5%204z%22/%3E%3Cpath%20d%3D%22M8%209.5h8M8%2012.5h5%22/%3E%3C/svg%3E") center/21px no-repeat!important;border:1px solid transparent!important}
body[data-shop="yoshi"] .ask{background-image:url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%235A3A7A%22%20stroke-width%3D%221.9%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M4%205h16v11H9l-5%204z%22/%3E%3Cpath%20d%3D%22M8%209.5h8M8%2012.5h5%22/%3E%3C/svg%3E")!important}
body[data-shop] .ask:active{transform:scale(.94)}
</style>
<script>
/* ป้ายระดับพนักงานให้เหมือนกันทั้ง 2 ร้าน: "(HOT.!)" → "HOT" */
(function(){var fix=function(){document.querySelectorAll('.who .nm .tag').forEach(function(t){var x=t.textContent,y=x.replace(/[().!]/g,'').trim();if(x!==y)t.textContent=y;var m=/^(TOP|HOT|NEW|COMEBACK)$/i.exec(y);if(m&&!t.classList.contains('t-'+m[1].toLowerCase()))t.classList.add('t-'+m[1].toLowerCase());});};
try{new MutationObserver(fix).observe(document.body,{childList:true,subtree:true});}catch(e){}fix();})();
</script>
<script>
/* ✂️ กล่องคำอธิบายสั้นลง (ไทย/อังกฤษ) + ตัวคั่น TOP เป็นตัวอักษรล้วน */
(function(){
  var NB={th:'<div class="nb-row">เวลาที่แสดง = <b>จองได้เลย</b> · ไม่มีในรายการ = ไม่ว่าง</div><div class="nb-row"><b>(1)</b> = ช่วงนั้นรับได้ 1 ชม. · นวด 1.30 ชม. ให้เริ่มก่อนหมดช่วง 30 นาที</div>',
          en:'<div class="nb-row">Times shown = <b>bookable</b> · not listed = busy</div><div class="nb-row"><b>(1)</b> = only 1 hr available · for 1.5 hr, start 30 min earlier</div>'};
  function fix(){
    var b=document.querySelector('.lg[aria-pressed="true"]'), l=b?b.getAttribute('data-l'):'th';
    var nb=document.querySelector('.notebox');
    if(nb&&NB[l]&&nb.getAttribute('data-short')!==l){nb.innerHTML=NB[l];nb.setAttribute('data-short',l);}
    document.querySelectorAll('.topdiv').forEach(function(t){if(/[^\x00-\x7F]/.test(t.textContent)&&/TOP/.test(t.textContent))t.textContent='TOP';});
  }
  var q=false; try{new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;fix();});}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['aria-pressed']});}catch(e){} fix();
})();
</script>
<script>
/* v3 — ปุ่มทักไลน์ลอยโผล่หลังเลื่อนผ่านกล่อง "จะถึงร้านกี่โมง" · ไอคอนเส้นทองแทนอีโมจิ */
(function(){
  var IC={"cam": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#C5A253\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8h3l2-2.5h6L17 8h3v11H4z\"/><circle cx=\"12\" cy=\"13\" r=\"3.6\"/></svg>", "tag": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#C5A253\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3.5 12.5V4h8.5l8.5 8.5-8.5 8.5z\"/><circle cx=\"8\" cy=\"8.5\" r=\"1.4\"/></svg>", "chat": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#C5A253\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H9l-5 4z\"/><path d=\"M8 9.5h8M8 12.5h5\"/></svg>"};
  function fab(){var f=document.getElementById('fab');if(!f)return;var box=document.querySelector('.atbox');var hide=false;
    if(box){var r=box.getBoundingClientRect();hide=r.bottom>window.innerHeight-10;}
    if(f.classList.contains('fab-hide')!==hide)f.classList.toggle('fab-hide',hide);}
  function icons(){document.querySelectorAll('.lb-ic').forEach(function(el){if(el.getAttribute('data-ic'))return;var t=el.textContent;
    var k=/📷|📸/.test(t)?'cam':(/💰|🏷|💸/.test(t)?'tag':'chat');el.innerHTML=IC[k];el.setAttribute('data-ic',k);});}
  window.addEventListener('scroll',fab,{passive:true});window.addEventListener('resize',fab);
  var q=false;try{new MutationObserver(function(){if(q)return;q=true;requestAnimationFrame(function(){q=false;fab();icons();});}).observe(document.body,{childList:true,subtree:true});}catch(e){}
  fab();icons();
})();
</script>
<script>
/* v4 — ร้านยังไม่เปิด (ม่าน 準備中) → ซ่อนป้าย 本日 (สำรองสำหรับเครื่องเก่าที่ไม่รองรับ :has) */
(function(){function f(){var n=document.getElementById('noren'),k=document.querySelector('.kanban');if(n&&k){var s=n.classList.contains('shut');if(k.classList.contains('is-shut')!==s)k.classList.toggle('is-shut',s);}}
try{new MutationObserver(f).observe(document.getElementById('noren'),{attributes:true,attributeFilter:['class']});}catch(e){} f();})();
</script>
</body>
