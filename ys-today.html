  position:absolute;left:0;right:0;bottom:34px;text-align:center;
  opacity:0;transition:opacity .55s ease .5s;
}
.noren.shut .shut-note{opacity:1}
.shut-note span{
  font-family:'Noto Serif Thai',serif;font-size:var(--t-s);
  color:rgba(245,237,226,.9);letter-spacing:.4em;text-indent:.4em;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}

/* ═══ ③ แบรนด์ ═══ */
.brand{text-align:center;padding:var(--s2) 0 var(--s3);position:relative;z-index:3}
.wordmark{width:min(268px,72%);display:block;margin:0 auto;border-radius:3px;
  box-shadow:0 var(--s1) 26px rgba(92,26,34,.14)}
.tagline{
  font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);
  letter-spacing:.3em;text-indent:.3em;color:var(--kin-d);margin-top:var(--s2);
}
.langs{display:flex;justify-content:center;gap:6px;margin-top:var(--s2)}
.lg{
  padding:5px 13px;border:1px solid var(--line-c);background:var(--washi-hi);
  font-family:'IBM Plex Sans Thai',sans-serif;font-size:var(--t-xs);color:var(--sumi-2);
  border-radius:99px;cursor:pointer;transition:all .2s ease;
}
.lg[aria-pressed="true"]{background:var(--aka);border-color:var(--aka);color:var(--washi-hi)}
.langs{display:flex;justify-content:center;gap:5px;margin-top:var(--s2);flex-wrap:wrap}
.lg{
  padding:5px 13px;border:1px solid var(--line-c);background:var(--washi-hi);
  color:var(--sumi-2);font-family:inherit;font-size:var(--t-xs);cursor:pointer;
  border-radius:2px;transition:all .22s ease;letter-spacing:.02em;
}
.lg[aria-pressed="true"]{background:var(--aka);border-color:var(--aka);color:var(--washi-hi);font-weight:600}
.divider{display:flex;align-items:center;justify-content:center;gap:var(--s2);
  margin:var(--s3) auto 0;max-width:250px}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--kin),transparent);opacity:.6}
.divider svg{opacity:.85;flex-shrink:0}

/* ═══ ④ วันที่ ═══ */
.today{
  display:flex;align-items:baseline;gap:var(--s2);
  padding:0 2px var(--s2);border-bottom:1px solid var(--line-c);margin-top:var(--s4);
}
.today .d{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:600;line-height:1.3}
.today .cnt{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  color:var(--kin-d);white-space:nowrap}

/* ═══ ⑤ รายชื่อ — แถวสูง 55px (Fib) ═══ */
.person{
  display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 3px;
  border-bottom:1px solid rgba(226,214,196,.72);
  opacity:0;transform:translateY(var(--s1));
  animation:rise .6s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.who{flex:1;min-width:0}
.who .nm{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:500;line-height:1.35}
.who .nm .tag{font-family:'JetBrains Mono',monospace;font-size:var(--t-xs);
  color:var(--aka);font-weight:600;margin-left:4px;letter-spacing:.02em}
.who .fr{font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  color:var(--sumi-2);margin-top:3px;letter-spacing:-.01em;line-height:1.6}
.who .nx{font-size:var(--t-xs);color:var(--aka);margin-top:3px;opacity:.85;font-weight:500}
.person.full .fr{color:#B9AE9E}
.person.full .nm{opacity:.6}
.atbox{
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(245,237,226,.5));
  border:1px solid rgba(197,162,83,.34);border-radius:3px;
  padding:var(--s3) var(--s3) var(--s2);margin:var(--s3) 0 var(--s2);
  box-shadow:0 1px 10px rgba(92,26,34,.05);
}
.at-h{font-size:var(--t-m);font-weight:600;color:var(--sumi);letter-spacing:.01em}
.at-s{font-size:var(--t-xs);color:var(--sumi-2);opacity:.8;margin-top:2px;line-height:1.6}
.at-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:var(--s2)}
.at-c{flex:1 1 auto;min-width:72px;padding:8px 6px;border:1px solid rgba(197,162,83,.42);
  background:rgba(255,255,255,.8);color:var(--sumi);border-radius:2px;
  font-family:inherit;font-size:var(--t-xs);cursor:pointer;transition:.2s}
.at-c:hover,.at-c:focus-visible{background:var(--gold);color:#fff;border-color:var(--gold)}
.at-c-all{border-style:dashed;color:var(--sumi-2)}
.at-c-all.on{background:var(--sumi);color:var(--washi);border-color:var(--sumi);border-style:solid}
.at-row{display:flex;gap:5px;margin-top:6px}
.at-row input{flex:1;min-width:0;padding:9px 10px;border:1px solid rgba(197,162,83,.42);
  border-radius:2px;background:#fff;color:var(--sumi);text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:var(--t-m);letter-spacing:.06em}
.at-row input:focus{outline:none;border-color:var(--gold)}
.at-go{padding:9px 18px;border:none;border-radius:2px;background:var(--sumi);color:var(--washi);
  font-family:inherit;font-size:var(--t-s);cursor:pointer;transition:.2s}
.at-go:hover{background:var(--aka)}

.at-on{margin-top:8px;padding-top:8px;border-top:1px solid rgba(197,162,83,.24);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:var(--t-s);font-weight:600;color:var(--aka)}
.at-clr{padding:5px 12px;border:1px solid rgba(92,26,34,.28);background:transparent;
  color:var(--sumi-2);border-radius:2px;font-family:inherit;font-size:var(--t-xs);cursor:pointer}
.at-clr:hover{background:rgba(92,26,34,.06)}
.notebox{
  margin-top:var(--s3);padding:var(--s2) var(--s3);
  background:var(--washi-hi);border:1px solid var(--line-c);border-left:2.5px solid var(--kin);
}
.nb-row{font-size:var(--t-s);color:var(--sumi-2);line-height:1.9}
.nb-row b{color:var(--aka);font-weight:600}
.linebox{margin-top:var(--s3)}
.lb-head{
  font-family:'Noto Serif Thai',serif;font-size:var(--t-m);font-weight:600;
  text-align:center;margin-bottom:var(--s2);color:var(--sumi);
}
.lb-items{display:flex;flex-direction:column;gap:var(--s1)}
.lb-item{
  display:flex;align-items:center;gap:var(--s2);
  padding:var(--s2) var(--s3);text-decoration:none;
  background:var(--washi-hi);border:1px solid var(--line-c);border-radius:2px;
  transition:border-color .25s ease,transform .2s ease;
}
.lb-item:hover,.lb-item:focus-visible{border-color:var(--kin);transform:translateY(-1px)}
.lb-ic{font-size:19px;flex-shrink:0;width:30px;text-align:center}
.lb-tx{flex:1;min-width:0;line-height:1.5}
.lb-tx b{display:block;font-size:var(--t-s);font-weight:600;color:var(--sumi)}
.lb-tx small{display:block;font-size:var(--t-xs);color:var(--sumi-2);margin-top:1px}
.lb-go{color:var(--kin-d);font-size:var(--t-l);flex-shrink:0;line-height:1}
.topdiv{
  text-align:center;padding:var(--s3) 0 var(--s2);
  font-size:var(--t-s);letter-spacing:.06em;color:var(--kin-d);
  opacity:0;transform:translateY(var(--s1));
  animation:rise .6s cubic-bezier(.16,1,.3,1) forwards;
}
.ask{
  flex-shrink:0;padding:var(--s1) var(--s3);border:1px solid var(--aka);
  background:transparent;color:var(--aka);text-decoration:none;border-radius:2px;
  font-size:var(--t-s);font-weight:500;transition:all .25s ease;
}
.ask:hover,.ask:focus-visible{background:var(--aka);color:var(--washi-hi)}

/* ═══ ⑥ สถานะ ═══ */
.state{text-align:center;padding:var(--s5) var(--s3)}
.state .ksv{opacity:.55;margin-bottom:var(--s3)}
.state h2{font-family:'Noto Serif Thai',serif;font-size:var(--t-l);font-weight:600;margin-bottom:var(--s1)}
.state p{font-size:var(--t-s);color:var(--sumi-2);line-height:1.95}
.state .clock{display:inline-block;margin-top:var(--s3);padding:var(--s1) var(--s3);
  border:1px solid var(--line-c);background:var(--washi-hi);
  font-family:'JetBrains Mono',monospace;font-size:var(--t-s);
  letter-spacing:.1em;color:var(--kin-d)}
.skel{height:55px;border-bottom:1px solid rgba(226,214,196,.72);
  background:linear-gradient(90deg,transparent,rgba(197,162,83,.08),transparent);
  background-size:220% 100%;animation:sh 1.5s ease-in-out infinite}
@keyframes sh{to{background-position:-220% 0}}

  try{
    const now=bkk();

// แปลงข้อความช่วงว่าง "16:00–17:20(1), 20:00–21:00" → [{s,e,one}] (นาที)
function parseSegTxt(txt){
  const out=[];
  String(txt||'').split(/[,、]/).forEach(part=>{
    const m=part.match(/(\d{1,2}):(\d{2})\s*[–\-]\s*(\d{1,2}):(\d{2})/);
    if(!m) return;
    let a=(+m[1])*60+(+m[2]), b=(+m[3])*60+(+m[4]);
    if(b<=a) b+=1440;
    out.push({s:a,e:b,one:/\(1\)/.test(part)});
  });
  return out;
}
// ว่างที่เวลานี้ไหม (เวลาแสดง = เวลาเริ่มได้ล่าสุด → นับรวมปลาย)
function freeAt(r,min){
  const segs=parseSegTxt(r.segTxt);
  if(!segs.length) return false;
  return segs.some(g=>{
    let t=min; if(t<g.s-720) t+=1440;      // ข้ามเที่ยงคืน
    return t>=g.s && t<=g.e;
  });
}
const clampMin=m=>((m%1440)+1440)%1440;
const fmtMin=m=>{if(!Number.isFinite(m))return'--:--';const x=clampMin(m);return `${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`;};

const SHOP_LOC={lat:13.728095,lng:100.655988};   // โยชิ · พัฒนาการ 74

// ── ผูกปุ่มแถบเลือกเวลา ──
function bindAtBar(){
  const inp=$('#atInput');
  if(inp){
    inp.addEventListener('input',()=>{
      let v=inp.value.replace(/\D/g,'').slice(0,4);
      if(v.length>=3) v=v.slice(0,v.length-2)+':'+v.slice(-2);
      inp.value=v;
    });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') applyAt(); });
  }
  $('#atGo')?.addEventListener('click',applyAt);

  // 🚗 เวลาขับรถจริง (OSRM ฟรี ไม่ต้องใช้ key) — เหมือนหน้าจองคิว
  $('#atTravel')?.addEventListener('click',()=>{
    const res=$('#atTravelRes'); if(!res) return;
    res.classList.add('show'); res.textContent=L('tvCalc');
    const fail=()=>{
      const dir='https://maps.app.goo.gl/GMTehgWDLdmnaNoL7';
      res.innerHTML=`${L('tvErr')}<br><a class="tv-use" href="${dir}" target="_blank" rel="noopener">${L('tvAlt')}</a>`
        +`<div class="tv-hint">${L('tvHint')}</div>`;
    };
    if(!navigator.geolocation || !window.isSecureContext){ fail(); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      const me=pos.coords, sh=SHOP_LOC;
      fetch(`https://router.project-osrm.org/route/v1/driving/${me.longitude},${me.latitude};${sh.lng},${sh.lat}?overview=false`)
        .then(r=>r.json()).then(j=>{
          const sec=j&&j.routes&&j.routes[0]&&j.routes[0].duration;
          if(!sec){ res.textContent=L('tvErr'); return; }
          const mins=Math.round(sec/60)+10;               // +10 นาที หาที่จอด/เดินเข้าร้าน
          const n=bkk();
          const am=Math.ceil(clampMin(n.getHours()*60+n.getMinutes()+mins)/10)*10;
          const at=fmtMin(am);
          res.innerHTML=`${L('tvRes')(mins,at)}<br><button class="tv-use" id="atTravelUse">${L('tvUse')(at)}</button>`;
          $('#atTravelUse').onclick=()=>{ atMin=am; render(); };
        }).catch(fail);
    },fail,{enableHighAccuracy:false,timeout:9000});
  });
  const _clr=()=>{ atMin=null; render(); };
  $('#atClr')?.addEventListener('click',_clr);
  $('#atAll')?.addEventListener('click',_clr);
  document.querySelectorAll('.at-c[data-add]').forEach(b=>b.addEventListener('click',()=>{
    const add=Number(b.dataset.add);
    if(!Number.isFinite(add)){ atMin=null; render(); return; }
    const n=bkk();
    atMin=Math.ceil(clampMin(n.getHours()*60+n.getMinutes()+add)/10)*10;
    render();
  }));
}
function applyAt(){
  const v=($('#atInput')?.value||'').trim();
  const m=v.match(/^(\d{1,2}):?(\d{2})$/);
  if(!m){ atMin=null; } else {
    const h=+m[1],mi=+m[2];
    atMin=(Number.isFinite(h)&&Number.isFinite(mi)&&h<24&&mi<60)?clampMin(h*60+mi):null;
  }
  render();
}

async function load(){
  try{
    const now=bkk(), dk=DOW[now.getDay()];
    const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    // ⭐ ใช้ตารางที่แอปแอดมินส่งมา (คำนวณด้วยสูตรเดียวกับข้อความอัพเดท LINE 100%)
    //    → เวลาตรงกันเป๊ะ + คนลางานหายไปเลย · ถ้าไม่มี/เก่า → คำนวณเองแบบเดิม
    // ⚡ 1) วาดจอทันทีจากที่จำไว้ในเครื่อง (ถ้าเป็นของวันนี้ อายุ < 10 นาที) — ไม่ต้องรอเน็ต
    try{
      const _raw = localStorage.getItem('yt_cache');
      if(_raw){
        const _c = JSON.parse(_raw);
        if(_c && _c.date===todayStr && (Date.now()-(_c.ts||0)) < 10*60*1000 && Array.isArray(_c.rows) && _c.rows.length){
          cache = _c.rows; lastUp = _c.lastUp || ''; render();
        }
      }
    }catch(_e){}

    // ⚡ 2) ยิงทั้ง 2 ทางพร้อมกัน — ไม่รอต่อคิวกันเหมือนเดิม
    const snapP = withTO(getDoc(doc(db,'snapshots','today_yoshi')), 3500).catch(()=>null);
    const mainP = withTO(Promise.all([
      getDocs(collection(db,'staff')),
      getDoc(doc(db,'schedules',weekId(now))),
      getDocs(query(collection(db,'walkins'),where('date','==',todayStr))),
      getDocs(query(collection(db,'bookings'),where('date','==',todayStr))),
    ]), 15000).catch(e=>({__err:e}));

    let snapBackup = null;
    try{
      const snapD = await snapP;
      if(snapD && snapD.exists()){
        const sn = snapD.data() || {};
        const fresh = sn.date === todayStr && Number(sn.updatedAt||0) > Date.now() - 45*60*1000;
        if(sn.date === todayStr && Array.isArray(sn.rows) && sn.rows.length) snapBackup = sn;
        if(fresh && Array.isArray(sn.rows) && sn.rows.length){
          const _t2m = t => { const m=String(t||'').match(/^(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):null; };
          const _m2t = m => `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
          cache = sn.rows.map(r=>{
            const txt = (lang==='th' ? r.time : (r.timeEn || r.time)) || '';
            const isFull = /รอบเต็ม|Fully booked/i.test(txt);
            // "(1)" = ขึ้นได้ 1 ชม. → คิวถัดไป = เวลาจบช่วง + 60 นาที
            const nextAts = [];
            String(txt).split(',').forEach(part=>{
              if(!/\(1\)/.test(part)) return;
              const mm = part.match(/[–-]\s*(\d{1,2}:\d{2})\s*\(1\)/);
              if(mm){ const e=_t2m(mm[1]); if(e!=null) nextAts.push(_m2t((e+60)%1440)); }
            });
            return {
              nickname: r.nick || '', nameEn: r.nameEn || r.nick || '', tier: r.tier || 'P',
              segs: isFull ? [] : [1], segTxt: txt, nextAts,
            };
          });
          lastUp = sn.updatedAtStr || '';
          saveCache(todayStr);
          render();
          return;
        }
      }
    }catch(_e){ /* อ่านไม่ได้ → คำนวณเองต่อ */ }

    const _main = await mainP;
    if (_main && _main.__err) throw _main.__err;
    const [ss,sc,ws,bs] = _main;
    // ⭐ ช่วงเวลาที่ติดคิว (จอง+กำลังใช้) ต่อพนักงาน — เฉพาะโยชิ
    const t2m=t=>{const m=String(t||'').match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
    const busy={};
    const addBusy=(sid,st,en)=>{const a=t2m(st);if(a==null)return;let b=t2m(en);if(b==null)b=a+90;if(b<=a)b+=1440;(busy[sid]=busy[sid]||[]).push([a,b])};
    const idsOf=r=>{const o=[];if(Array.isArray(r.staffIds))o.push(...r.staffIds);if(r.staffId)o.push(r.staffId);if(r.staffId2)o.push(r.staffId2);return[...new Set(o.filter(Boolean))]};
    ws.forEach(d=>{const w=d.data();if(w.shop!=='yoshi'||w.active===false||w.status==='cancelled')return;idsOf(w).forEach(id=>addBusy(id,w.startTime,w.endTime))});
    bs.forEach(d=>{const b=d.data();if(b.shop!=='yoshi'||b.status==='cancelled'||b.checkedInWalkinId)return;idsOf(b).forEach(id=>addBusy(id,b.startTime,b.endTime))});
    const nowMin=now.getHours()*60+now.getMinutes();
    const m2t=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
    // ⭐ ช่วงว่างจริงของพนักงาน (format เดียวกับข้อความอัพเดท: 14:00–18:10(1), 21:00–24:00)
    const mEnd=m=>{const x=m%1440;return x===0?'24:00':m2t(x)};
    // (1) = ช่วงนั้นขึ้นได้ 1 ชม. เพราะติดจองต่อ · เวลาจบช่วง = เวลาจองถัดไป − 1 ชม.
    function freeSegs(sid, sStart, sEnd){
      let a=t2m(sStart); if(a==null)a=660;
      let b=t2m(sEnd); if(b==null||b===0)b=1440; if(b<=a)b+=1440;
      const raw=(busy[sid]||[]).map(([x,y])=>[Math.max(x,a),Math.min(y,b)])
        .filter(([x,y])=>y>x).sort((p,q)=>p[0]-q[0]);
      const mg=[];raw.forEach(([x,y])=>{if(mg.length&&x<=mg[mg.length-1][1]+5)mg[mg.length-1][1]=Math.max(mg[mg.length-1][1],y);else mg.push([x,y])});
      let cur=Math.max(a, Math.ceil(nowMin/10)*10);
      const segs=[];
      for(const [x,y] of mg){
        if(y<=cur) continue;
        if(x>cur){
          const dispEnd=x-60;                 // จองได้ช้าสุด = คิวถัดไป − 1 ชม.
          if(dispEnd>=cur) segs.push({f:cur,t:dispEnd,nextAt:x});
        }
        cur=Math.max(cur,y);
      }
      if(cur<b-5) segs.push({f:cur,t:b,nextAt:null});
      return segs.slice(0,3);
    }
    const segText=segs=>segs.map(sg=>`${m2t(sg.f)}–${mEnd(sg.t)}${sg.nextAt?'(1)':''}`).join(', ');
    const staff={}; ss.forEach(d=>{staff[d.id]=d.data()});
    const sched=sc.exists()?sc.data():{};
    const out=[];
    Object.entries(sched).forEach(([sid,week])=>{
      if(!week||typeof week!=='object') return;
      const e=week[dk];
      if(!e||e==='off'||e.off||e.shop!=='yoshi') return;
      const s=staff[sid];
      if(!s||s.active===false) return;
      if(String(s.status||'').includes('ลาออก')) return;
      const _segs=freeSegs(sid, hhmm(e.start)||'11:00', hhmm(e.end)||'24:00');
      out.push({
        nickname:s.nickname||s.shortCode||'',
        nameEn:s.nameEn||s.shortCode||'',
        tier:s.tier||'P',
        hl:'',
        segs:_segs,
        segTxt:segText(_segs),
        nextAts:_segs.filter(g=>g.nextAt).map(g=>m2t(g.nextAt)),
        firstFree:_segs.length?_segs[0].f:99999,
      });
    });
    // เรียง: ว่างก่อนขึ้นก่อน · แยกกลุ่ม TOP ไปท้าย (เหมือนข้อความอัพเดท)
    out.sort((x,y)=>x.firstFree-y.firstFree||String(x.nickname||x.nameEn).localeCompare(String(y.nickname||y.nameEn),'th'));
    cache=out;
    const _n=bkk(); lastUp=`${String(_n.getHours()).padStart(2,'0')}:${String(_n.getMinutes()).padStart(2,'0')}`;
    saveCache(todayStr);
  }catch(err){
    console.error(err);
    // ⭐ query หลักล้ม/ช้า → ใช้ตารางสำรองจากแอปแอดมิน (ถึงจะเก่าไปบ้างก็ยังดีกว่าจอว่าง)
    if(snapBackup && Array.isArray(snapBackup.rows)){
      cache = snapBackup.rows.map(r=>({
        nickname:r.nick||'', nameEn:r.nameEn||r.nick||'', tier:r.tier||'P',
        segs:/รอบเต็ม|Fully booked/i.test(r.time||'')?[]:[1],
        segTxt:(lang==='th'?r.time:(r.timeEn||r.time))||'', nextAts:[],
      }));
      lastUp = snapBackup.updatedAtStr || '';
      render();
      return;
    }
    $('#body').innerHTML=`<div class="state"><div class="ksv">${KSVG40}</div>
      <h2>${L('errH')}</h2>
      <p>${L('errP')}</p>
      <button id="retryBtn" class="at-go" style="margin-top:14px;padding:11px 26px">${L('retry')}</button></div>`;
    $('#retryBtn')?.addEventListener('click',()=>{ cache=null; render(); load(); });
    return;
  }
  render();
}

function petals(){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  for(let i=0;i<8;i++){
    const p=document.createElement('div'); p.className='petal';
    const sz=7+Math.random()*6;
    p.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz*.76}px;
      background:rgba(240,190,204,${.4+Math.random()*.28});
      border-radius:${sz}px 0 ${sz}px 0;
      animation-duration:${14+Math.random()*11}s;animation-delay:${-Math.random()*24}s`;
    document.body.appendChild(p);
  }
}

function applyLang(){
  document.documentElement.lang = lang;
  $('#tagline').textContent = L('tag');
  $('#fabTx').textContent = L('fab');
  $('#ftOpen').textContent = L('open');
  $('#ftChg').textContent = L('chg');
  document.querySelectorAll('.lg').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
  render();
}
document.querySelectorAll('.lg').forEach(b=>{
  b.onclick=()=>{ lang=b.dataset.l; localStorage.setItem('gt_lang',lang); applyLang(); };
});

(function(){
  var SEL='.at-c,.at-c-all,.at-go,.at-map,.tv-use,.ask,.lb-item,.lg,.fab,.again,.maplink';
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;

    var r=el.getBoundingClientRect(), size=Math.max(r.width,r.height)*1.6;
    var w=document.createElement('span'); w.className='rp-wave';
    w.style.width=w.style.height=size+'px';
    w.style.left=(e.clientX-r.left)+'px'; w.style.top=(e.clientY-r.top)+'px';
    el.appendChild(w); setTimeout(function(){ w.remove(); },600);
  },{passive:true});
})();
